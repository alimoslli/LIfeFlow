<title>LifeFlow Day Sky</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: the app's Today screen in one phone-width column (top bar, the clock, the ask bar, the tab bar), on the
   app's own tokens from src/app/globals.css, so it looks and reads exactly like LifeFlow in light and dark. */
:root {
  --bg: #f6f8fb;
  --surface: #ffffff;
  --surface-2: #eef2f7;
  --surface-3: #e3e9f1;
  --border: #e3e9f1;
  --border-strong: #c9d3e0;
  --text: #0f1a2a;
  --text-2: #36435a;
  --muted: #5f6b7d;
  /* Official mark palette: moss glass, soft sage highlights, and warm cream. */
  --brand-moss: #285b45;
  --brand-sage: #84a990;
  --brand-mist: #dce9d9;
  --brand-cream: #f8f2e7;
  --accent: #2468c4;
  --accent-hover: #1d58a8;
  --accent-soft: #e3eefb;
  --accent-text: #ffffff;
  /* Feature cards ("Up next", Money): a clear day sky in light, the night sky in dark. */
  --hero: #1f63bd;
  --hero-text: #ffffff;
  --danger: #b42318;
  --danger-soft: #fdecea;
  --warning: #9a5806;
  --warning-soft: #fdf1dc;
  --success: #12704a;
  --success-soft: #e3f3ea;
  --info: #2d5a9e;
  --info-soft: #e7eef9;
  --ring: #2468c466;
  --shadow: 0 1px 2px rgb(15 26 42 / 0.04), 0 8px 24px -6px rgb(15 26 42 / 0.1);
  --shadow-lift: 0 2px 4px rgb(15 26 42 / 0.04), 0 18px 40px -12px rgb(15 26 42 / 0.22);
  /* Chart series (validated pair: CVD ΔE 24.7, contrast >= 3:1) */
  --series-income: #2a78d6;
  --series-spend: #eb6834;
  /* Day Sky: the sun (and the words that go with it), the night */
  --sun: #f5a524;
  --sun-ink: #b45309;
  --night: #07101f;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07101f;
    --surface: #0f1a2e;
    --surface-2: #15223a;
    --surface-3: #1d2c47;
    --border: #1d2c47;
    --border-strong: #2b3d5c;
    --text: #eef3fb;
    --text-2: #c8d3e4;
    --muted: #93a1b7;
    --accent: #7db3f2;
    --accent-hover: #9cc6f6;
    --accent-soft: #15294a;
    --accent-text: #06101f;
    --hero: #0f2a52;
    --hero-text: #eef3fb;
    --danger: #ff9a8e;
    --danger-soft: #3d1c19;
    --warning: #f0bb6c;
    --warning-soft: #362817;
    --success: #7fdcab;
    --success-soft: #16322a;
    --info: #9ec2f5;
    --info-soft: #1a2739;
    --ring: #7db3f266;
    /* Shadows don't read on dark backgrounds; a hairline ring separates surfaces instead. */
    --shadow: 0 0 0 1px rgb(255 255 255 / 0.07), 0 1px 2px rgb(0 0 0 / 0.4);
    --shadow-lift: 0 0 0 1px rgb(255 255 255 / 0.1), 0 18px 40px -12px rgb(0 0 0 / 0.7);
    --series-income: #3987e5;
    --series-spend: #d95926;
    --sun: #f7b955;
    --sun-ink: #ffc56b;
    --night: #050b17;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #07101f;
  --surface: #0f1a2e;
  --surface-2: #15223a;
  --surface-3: #1d2c47;
  --border: #1d2c47;
  --border-strong: #2b3d5c;
  --text: #eef3fb;
  --text-2: #c8d3e4;
  --muted: #93a1b7;
  --accent: #7db3f2;
  --accent-hover: #9cc6f6;
  --accent-soft: #15294a;
  --accent-text: #06101f;
  --hero: #0f2a52;
  --hero-text: #eef3fb;
  --danger: #ff9a8e;
  --danger-soft: #3d1c19;
  --warning: #f0bb6c;
  --warning-soft: #362817;
  --success: #7fdcab;
  --success-soft: #16322a;
  --info: #9ec2f5;
  --info-soft: #1a2739;
  --ring: #7db3f266;
  /* Shadows don't read on dark backgrounds; a hairline ring separates surfaces instead. */
  --shadow: 0 0 0 1px rgb(255 255 255 / 0.07), 0 1px 2px rgb(0 0 0 / 0.4);
  --shadow-lift: 0 0 0 1px rgb(255 255 255 / 0.1), 0 18px 40px -12px rgb(0 0 0 / 0.7);
  --series-income: #3987e5;
  --series-spend: #d95926;
  --sun: #f7b955;
  --sun-ink: #ffc56b;
  --night: #050b17;
  color-scheme: dark;
}
:root {
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Fraunces", ui-serif, Georgia, serif;
  --font-geist-sans: "Geist";
}
[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.app {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 112px;
}
.top {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.top img {
  width: 34px;
  height: 34px;
}
.top-r {
  display: flex;
  margin-right: -10px;
}
.ib {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  color: var(--text);
  border-radius: 22px;
}
.ib svg {
  width: 22px;
  height: 22px;
}
/* the concept bar: what this page is, and a time to see it at */
.concept {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-block: 2px 10px;
}
.concept p {
  margin: 0;
  font-size: 0.78rem;
  line-height: 1.4;
  color: var(--muted);
}
.concept b {
  color: var(--text-2);
  font-weight: 600;
}
.times {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
}
.times .play {
  width: 40px;
  height: 40px;
  border-radius: 20px;
  background: var(--text);
  color: var(--bg);
  display: grid;
  place-items: center;
}
.times .play svg {
  width: 14px;
  height: 14px;
}
.times output {
  min-width: 64px;
  text-align: right;
  font-size: 0.85rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
input[type="range"].dayslider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 40px;
  background: transparent;
  margin: 0;
}
input[type="range"].dayslider::-webkit-slider-runnable-track {
  height: 12px;
  border-radius: 6px;
  background: var(--track);
}
input[type="range"].dayslider::-moz-range-track {
  height: 12px;
  border-radius: 6px;
  background: var(--track);
}
input[type="range"].dayslider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  margin-top: -6px;
  border-radius: 50%;
  background: #ffd77a;
  border: 3px solid #fff;
  box-shadow: 0 3px 10px rgb(245 165 36 / 0.6);
}
input[type="range"].dayslider::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #ffd77a;
  border: 3px solid #fff;
}
/* the assistant's one line, in the clock's foot (as in the app) */
.ast {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--shadow);
  text-align: left;
  width: 100%;
}
.ast img {
  width: 30px;
  height: 30px;
  flex: none;
}
.ast span {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.ast-k {
  font-size: 0.78rem;
  color: var(--muted);
}
.ast-t {
  font-size: 0.95rem;
  line-height: 1.35;
}
.ast-a {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--accent);
  margin-top: 4px;
}
/* the ask bar and the tab bar, fixed at the bottom like the app shell */
.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.tabs {
  pointer-events: auto;
  max-width: 436px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 6px;
  border-radius: 28px;
  background: var(--surface);
  box-shadow: var(--shadow-lift);
  border: 1px solid var(--border);
}
.tab {
  min-height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-radius: 22px;
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-2);
}
.tab svg {
  width: 22px;
  height: 22px;
}
.tab[aria-current="page"] {
  color: var(--accent);
  background: var(--accent-soft);
}
.ask {
  margin-top: 14px;
  width: 100%;
  min-height: 48px;
  border-radius: 24px;
  padding: 0 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  text-align: left;
  font-size: 0.95rem;
}
/* the pin sheet */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet-back {
  position: absolute;
  inset: 0;
  background: rgb(0 0 0 / 0.35);
}
.sheet-card {
  position: relative;
  width: 100%;
  max-width: 460px;
  max-height: 92%;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow-lift);
  animation: rise 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes rise {
  from {
    transform: translateY(24px);
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .sheet-card {
    animation: none;
  }
}
.grab {
  width: 40px;
  height: 5px;
  border-radius: 3px;
  background: var(--border-strong);
  margin: 0 auto 2px;
}
.sheet h2 {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 600;
}
.pin-row {
  display: flex;
  gap: 12px;
  align-items: center;
}
.pin-ic {
  width: 48px;
  height: 48px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: var(--surface-2);
  font-size: 1.5rem;
}
.field {
  min-height: 48px;
  min-width: 0;
  flex: 1;
  border-radius: 16px;
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--text);
  padding: 0 14px;
  font: inherit;
  font-size: 1rem;
}
.emojis {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-inline: -20px;
  padding-inline: 20px;
}
.emojis::-webkit-scrollbar {
  display: none;
}
.emojis button {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  font-size: 1.4rem;
}
.emojis button[aria-checked="true"] {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.kinds {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.kinds button {
  min-height: 56px;
  padding: 8px 12px;
  border-radius: 16px;
  background: var(--surface-2);
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.kinds b {
  font-size: 0.92rem;
  font-weight: 600;
}
.kinds small {
  font-size: 0.74rem;
  color: var(--muted);
}
.kinds button[aria-checked="true"] {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.when {
  display: flex;
  gap: 10px;
}
.when label {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.8rem;
  color: var(--muted);
}
.acts {
  display: flex;
  gap: 10px;
}
.acts button {
  flex: 1;
  min-height: 48px;
  border-radius: 24px;
  font-weight: 600;
  background: var(--surface-2);
}
.acts .primary {
  background: var(--accent);
  color: var(--accent-text);
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 50;
  max-width: min(420px, calc(100% - 32px));
  padding: 12px 16px;
  border-radius: 16px;
  background: var(--text);
  color: var(--bg);
  font-size: 0.88rem;
  line-height: 1.35;
  box-shadow: var(--shadow-lift);
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
/* ---- the day clock: src/components/day-clock/day-clock.css, as the app ships it ---- */
/* The day clock (v3 home). Colours are the app's theme tokens, so it reads the same in light and dark:
   one accent (the moss/mint green) for everything busy, the text colour for the face. */
.dc {
  position: relative;
  overflow: hidden;
  /* Phones: the whole screen between the top bar and the tab bar (the assistant's line sits inside, at the foot). */
  height: clamp(500px, calc(100svh - 168px), 720px);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  color: var(--text);
}
@media (min-width: 768px) {
  .dc {
    height: 620px;
  }
}
/* Only the clock's own buttons are reset; anything placed in the foot keeps its own styles. */
:where(.dc-sub, .dc-tiles, .dc-track, .dc-detail) button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
.dc button:focus-visible,
.dc [role="button"]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.dc canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}
.dc > svg {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  overflow: visible;
}
.dc-callouts,
.dc-micons {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.dc-callouts {
  z-index: 3;
}
.dc-micons {
  z-index: 4;
}
.dc-probe,
.dc-hap {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
}

/* the face */
.dc-rim {
  fill: none;
  stroke: color-mix(in srgb, var(--text) 22%, transparent);
  stroke-width: 2;
  stroke-linecap: round;
}
.dc-arc,
.dc-arc-glow {
  fill: none;
  stroke: var(--accent);
  stroke-linecap: round;
}
.dc-arc {
  stroke-width: 3;
}
.dc-arc-glow {
  stroke-width: 5;
}
.dc-num {
  fill: var(--text);
  font-size: 18px;
  font-weight: 650;
}
.dc-tick {
  stroke: color-mix(in srgb, var(--text) 70%, transparent);
  stroke-width: 2;
  stroke-linecap: round;
}
/* the outer ring (the 12 hours after the next 12), the seam at the hand, and tomorrow's tint */
.dc-outer-ring {
  fill: none;
  stroke: color-mix(in srgb, var(--text) 13%, transparent);
  stroke-width: 2;
}
.dc-tmrw-track {
  fill: none;
  stroke: color-mix(in srgb, var(--accent) 30%, transparent);
  stroke-width: 2;
  stroke-linecap: round;
}
.dc-seam {
  stroke: color-mix(in srgb, var(--text) 45%, transparent);
  stroke-width: 2;
  stroke-linecap: round;
}
/* markers on the outer ring: later, so a little quieter */
.dc-co.dc-later {
  font-size: 0.74rem;
  color: var(--text-2);
}
/* tomorrow's ring: just outside the clock, from the 12 round to the hand */
.dc-tmrw-ring {
  fill: none;
  stroke: color-mix(in srgb, var(--accent) 34%, transparent);
  stroke-width: 2;
  stroke-linecap: round;
}
.dc-tmrw-end {
  fill: color-mix(in srgb, var(--accent) 55%, transparent);
}
.dc-face-tag {
  fill: var(--accent);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  stroke: var(--bg);
  stroke-width: 4;
  stroke-linejoin: round;
  paint-order: stroke;
}
.dc-face-now {
  fill: var(--text);
  font-size: 12.5px;
  font-weight: 600;
  stroke: var(--bg);
  stroke-width: 4;
  stroke-linejoin: round;
  paint-order: stroke;
}
.dc-step {
  stroke: var(--accent);
  stroke-width: 2.4;
  stroke-linecap: round;
}
.dc-accent-fill {
  fill: var(--accent);
}
.dc-word {
  fill: var(--accent);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 1.6px;
}
.dc-hour,
.dc-minute {
  stroke: var(--text);
  stroke-linecap: round;
}
.dc-hour {
  stroke-width: 5;
}
.dc-minute {
  stroke-width: 3.2;
}
.dc-hub {
  fill: var(--text);
}
.dc-leader {
  stroke: color-mix(in srgb, var(--text) 38%, transparent);
  stroke-width: 1;
}
.dc-steps {
  fill: var(--muted);
  font-size: 11.5px;
  stroke: var(--bg);
  stroke-width: 4;
  stroke-linejoin: round;
  paint-order: stroke;
}
.dc-steps-n {
  fill: var(--text);
  font-weight: 600;
}
.dc-halo {
  fill: none;
  stroke: var(--accent);
  stroke-width: 10;
}
.dc-press-ring {
  fill: none;
  stroke: var(--accent);
  stroke-opacity: 0.55;
  stroke-width: 1.5;
}
.dc-stop-a {
  stop-color: var(--accent);
  stop-opacity: 0.34;
}
.dc-stop-b {
  stop-color: var(--accent);
  stop-opacity: 0.2;
}
.dc-stop-c {
  stop-color: var(--accent);
  stop-opacity: 0.1;
}

/* markers around the rim */
.dc-co {
  position: absolute;
  left: 0;
  top: 0;
  font-size: 0.8rem;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.dc-tm {
  display: block;
  margin-top: 1px;
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
}
.dc-mi {
  position: absolute;
  left: 0;
  top: 0;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  font-size: 26px;
  line-height: 1;
  will-change: transform;
}
.dc-hit {
  position: absolute;
  z-index: 7;
  border-radius: 50%;
  touch-action: pan-y;
  cursor: pointer;
}
.dc-hint {
  position: absolute;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 0.8rem;
  color: var(--muted);
  z-index: 3;
  pointer-events: none;
}
.dc-foot {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 8px;
  max-width: 560px;
  margin: 0 auto;
  z-index: 8;
}
.dc-foot:empty {
  display: none;
}
/* "Pin something": under the tiles while the timeline is open and no card is showing */
.dc-pinbar {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 8;
  display: flex;
  justify-content: center;
  visibility: hidden;
}
.dc[data-state="timeline"] .dc-pinbar {
  visibility: visible;
}
.dc-detail:not(:empty) ~ .dc-pinbar {
  display: none;
}
.dc-pinbar button {
  min-height: 44px;
  padding: 0 18px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.9rem;
  font-weight: 600;
}
.dc-hint-wrap {
  z-index: 6;
  opacity: 0;
}

/* "Today ⌄" and the day picker */
.dc-sub {
  position: absolute;
  left: 0;
  right: 0;
  height: 44px;
  z-index: 8;
}
.dc-todaybtn {
  position: absolute;
  left: 20px;
  top: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 1.15rem;
  font-weight: 500;
}
.dc-days {
  position: absolute;
  inset: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  opacity: 0;
  pointer-events: none;
}
/* Every button is a real 44 px box; the pill you see is the middle 36 px (transparent borders above and below). */
.dc-days button {
  position: relative;
  height: 44px;
  min-width: 44px;
  padding: 0 6px;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  background-clip: padding-box;
  border-radius: 22px;
  font-size: 0.95rem;
  display: grid;
  place-items: center;
  white-space: nowrap;
}
.dc-days .dc-arrow {
  color: var(--muted);
  min-width: 44px;
  padding: 0;
  flex: none;
}
.dc-days .dc-on {
  background: var(--accent);
  color: var(--accent-text);
  font-weight: 600;
  padding: 0 13px;
  flex: none;
}
@media (min-width: 768px) {
  .dc-days {
    justify-content: center;
    gap: 14px;
  }
}

/* the tiles: the day's shift, class and deadline */
.dc-tiles {
  position: absolute;
  left: 0;
  right: 0;
  height: 58px;
  display: flex;
  justify-content: center;
  gap: 8px;
  z-index: 8;
  padding: 0 16px;
  pointer-events: none;
}
.dc-tile {
  flex: 1 1 0;
  max-width: 160px;
  height: 58px;
  padding: 0 12px;
  border-radius: 18px;
  background: var(--surface);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  opacity: 0;
}
.dc-tile svg {
  flex: none;
  width: 20px;
  height: 20px;
  color: var(--accent);
}
.dc-tx {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.dc-tn {
  font-size: 0.72rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dc-tt {
  font-size: 0.95rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}
.dc-tile[aria-pressed="true"] {
  box-shadow: inset 0 0 0 1.5px var(--accent);
}
/* Phones: seven days fit as 44 px targets without the arrows (tap a day, or scroll the line). */
@media (max-width: 520px) {
  .dc-days .dc-arrow {
    display: none;
  }
}
@media (max-width: 380px) {
  .dc-days {
    inset: 0 6px;
  }
  .dc-days button {
    font-size: 0.9rem;
  }
  .dc-days .dc-on {
    padding: 0 10px;
  }
  .dc-tiles {
    gap: 6px;
    padding: 0 12px;
  }
  .dc-tile {
    padding: 0 10px;
    gap: 8px;
  }
  .dc-tile svg {
    width: 18px;
    height: 18px;
  }
}

/* the line */
.dc-trackwrap {
  position: absolute;
  left: 0;
  right: 0;
  height: 156px;
  overflow-x: auto;
  overflow-y: hidden;
  z-index: 5;
  touch-action: pan-x;
  scrollbar-width: none;
  pointer-events: none;
  clip-path: inset(0 50% 0 50%);
  overscroll-behavior-x: contain;
}
.dc-trackwrap::-webkit-scrollbar {
  display: none;
}
.dc[data-open="true"] .dc-trackwrap,
.dc[data-open="true"] .dc-days,
.dc[data-open="true"] .dc-tiles,
.dc[data-open="true"] .dc-detail {
  pointer-events: auto;
}
.dc-track {
  position: relative;
  height: 100%;
}
.dc[data-state="timeline"] .dc-track {
  cursor: copy;
}
.dc[data-state="timeline"] .dc-track .dc-node,
.dc[data-state="timeline"] .dc-track .dc-now {
  cursor: pointer;
}
.dc-line {
  position: absolute;
  left: 0;
  top: 69px;
  height: 2px;
  border-radius: 1px;
  background: linear-gradient(
    to right,
    color-mix(in srgb, var(--accent) 50%, transparent) 0,
    color-mix(in srgb, var(--accent) 50%, transparent) var(--now-x),
    var(--accent) var(--now-x)
  );
}
.dc-band {
  position: absolute;
  top: 67px;
  height: 6px;
  border-radius: 3px;
  background: color-mix(in srgb, var(--accent) 24%, transparent);
  opacity: var(--tlab, 1);
}
.dc-mid {
  position: absolute;
  top: 56px;
  width: 1px;
  height: 28px;
  background: var(--border-strong);
  opacity: var(--tlab, 1);
}
.dc-mid span {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
/* further out: a month or a year, marked once; and the Someday stretch at the end */
.dc-mid.dc-era {
  background: var(--border-strong);
}
.dc-mid.dc-era span {
  color: var(--text-2);
  font-weight: 600;
  letter-spacing: 0.12em;
}
.dc-someday .dc-n-dot {
  border-color: var(--muted);
}
/* tonight's midnight on the line: where tomorrow starts, said the same way as on the clock */
.dc-mid.dc-next {
  width: 2px;
  margin-left: -0.5px;
  background: var(--accent);
}
.dc-mid.dc-next span {
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.12em;
}
.dc-node {
  position: absolute;
  top: 0;
  width: 92px;
  height: 156px;
  margin-left: -46px;
  display: block;
}
.dc-n-ic {
  position: absolute;
  left: 50%;
  top: 21px;
  width: 30px;
  height: 30px;
  margin-left: -15px;
  display: grid;
  place-items: center;
  font-size: 27px;
  line-height: 1;
}
.dc-n-dot {
  position: absolute;
  left: 50%;
  top: 64px;
  width: 12px;
  height: 12px;
  margin-left: -6px;
  border-radius: 50%;
  border: 2px solid var(--accent);
  background: var(--bg);
}
.dc-past .dc-n-dot {
  background: var(--accent);
}
.dc-sel .dc-n-dot {
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 28%, transparent);
}
.dc-n-t {
  position: absolute;
  left: 0;
  right: 0;
  top: 86px;
  font-size: 0.8rem;
  text-align: center;
  font-variant-numeric: tabular-nums;
  opacity: var(--tlab, 1);
}
.dc-n-n {
  position: absolute;
  left: 0;
  right: 0;
  top: 104px;
  font-size: 0.75rem;
  color: var(--muted);
  text-align: center;
  line-height: 1.25;
  opacity: var(--tlab, 1);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  padding: 0 2px;
}
.dc-mapped .dc-n-ic {
  visibility: hidden;
}
/* the now pill: a 44 px button around the 26 px pill you see */
.dc-now {
  position: absolute;
  top: 15px;
  height: 44px;
  display: flex;
  align-items: center;
  transform: translateX(-50%);
}
.dc-now-pill {
  height: 26px;
  padding: 0 10px 0 7px;
  border-radius: 13px;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 0.78rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.dc-now::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 35px;
  width: 2px;
  height: 20px;
  margin-left: -1px;
  background: var(--accent);
}
.dc-now i {
  position: absolute;
  left: 50%;
  top: 49px;
  width: 12px;
  height: 12px;
  margin-left: -6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 70%, transparent);
}

/* one quiet card, on a tap */
.dc-detail:empty {
  display: none;
}
.dc-detail {
  position: absolute;
  left: 16px;
  right: 16px;
  max-width: 520px;
  margin: 0 auto;
  z-index: 8;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  border-radius: 22px;
  padding: 16px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  opacity: 0;
  pointer-events: none;
}
.dc-d-ic {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 24px;
  flex: none;
}
.dc-d-body {
  min-width: 0;
  flex: 1;
}
.dc-d-k {
  font-size: 0.7rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 3px;
}
.dc-d-t {
  font-size: 1.05rem;
  font-weight: 600;
}
.dc-d-w {
  font-size: 0.9rem;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.dc-d-s {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.35;
}
.dc-d-s:empty {
  display: none;
}
/* a stack's card: one row per thing, each a full-width 44 px tap */
.dc-d-list {
  display: flex;
  flex-direction: column;
  max-height: 200px;
  margin: 6px -8px 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.dc .dc-d-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 0 8px;
  border-radius: 12px;
  text-align: left;
  color: var(--text);
}
.dc .dc-d-row:active {
  background: var(--surface-2);
}
.dc-r-ic {
  font-size: 1.1rem;
}
.dc-r-n {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  font-size: 0.9rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dc-r-t {
  color: var(--muted);
  font-size: 0.8rem;
  font-variant-numeric: tabular-nums;
}
/* "+2" on a stack's icon (placed against the icon, which is already positioned) and on a merged marker */
.dc-n-more {
  position: absolute;
  top: -4px;
  right: -12px;
  min-width: 20px;
  padding: 1px 5px;
  border-radius: 10px;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 0.65rem;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
}
/* tomorrow's markers: the same green as TOMORROW on the ring, instead of a caption under each */
.dc-co.dc-tmrw,
.dc-co.dc-tmrw .dc-co-sub {
  color: var(--accent);
}
/* the time under a named pile on the clock ("11:59 PM" under "9 assignments due tonight") */
.dc-co-sub {
  display: block;
  margin-top: 1px;
  color: var(--muted);
  font-size: 0.72rem;
}
.dc-more {
  margin-left: 4px;
  color: var(--accent);
  font-weight: 700;
}
.dc-d-acts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.dc .dc-d-done {
  height: 44px;
  padding: 0 16px;
  border-radius: 22px;
  background: var(--accent);
  color: var(--accent-text);
  font-size: 0.85rem;
  font-weight: 600;
}
.dc .dc-d-edit,
.dc .dc-d-open {
  position: relative;
  height: 44px;
  padding: 0 14px;
  border-radius: 18px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.85rem;
  font-weight: 600;
}

/* ---- Day Sky (owner, 2026-11-09): Today as the sky (sky.ts), and the timeline as a window onto it ---- */
/* The sky reaches up behind the top bar, so the clock only clips sideways. */
.dc.dc-skymode {
  overflow-x: clip;
  overflow-y: visible;
}
.dc-skybg {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.dc-skybg .dc-stars {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.dc-stars circle {
  fill: #ffffff;
  animation: dc-tw 3.2s ease-in-out infinite alternate;
}
@keyframes dc-tw {
  from {
    opacity: 0.25;
  }
  to {
    opacity: 1;
  }
}
.dc-cloud {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgb(255 255 255 / 0.85), rgb(255 255 255 / 0));
  animation: dc-drift 60s linear infinite alternate;
}
.dc-cloud-b {
  animation-duration: 80s;
  animation-direction: alternate-reverse;
}
@keyframes dc-drift {
  from {
    transform: translateX(-30px);
  }
  to {
    transform: translateX(40px);
  }
}
@media (prefers-reduced-motion: reduce) {
  .dc-stars circle,
  .dc-cloud {
    animation: none;
  }
}
.dc-dome {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
  overflow: visible;
}
/* (.dc canvas stretches the clock's own canvas; the companion keeps its size) */
.dc .dc-who {
  position: absolute;
  inset: auto;
  left: 0;
  top: 0;
  width: 48px;
  height: 48px;
  z-index: 3;
  pointer-events: none;
  image-rendering: pixelated;
}
/* under the horizon, in words */
.dc-words {
  position: absolute;
  left: 20px;
  right: 20px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  pointer-events: none;
}
.dc-w-tag {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--sun-ink);
}
.dc-w-now {
  margin-top: 6px;
  max-width: 100%;
  font-family: var(--font-display);
  font-size: 1.95rem;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.1;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-wrap: balance;
}
.dc-w-then {
  margin-top: 6px;
  font-size: 0.9rem;
  color: var(--muted);
}
.dc-w-pills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
}
.dc-w-pills span {
  height: 32px;
  padding: 0 12px;
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow);
  display: inline-flex;
  align-items: center;
  font-size: 0.84rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.dc-w-after {
  margin-top: 12px;
  font-size: 0.8rem;
  color: var(--muted);
}
/* "Today" sits on the sky, in its ink */
.dc-skymode .dc-todaybtn {
  color: var(--sky-ink, var(--text));
  font-family: var(--font-display);
  font-size: 1.65rem;
  font-weight: 600;
  letter-spacing: -0.02em;
}
/* the top bar over the sky (Today, closed): light icons on a dark sky */
html[data-sky="dark"] .lf-appbar:not(.lf-appbar-scrolled) {
  color: #eef3fb;
}
html[data-sky="dark"] .lf-appbar:not(.lf-appbar-scrolled) .text-text-2 {
  color: #eef3fb;
}

/* the timeline: a window onto the sky, a hill for every day and a valley for every night (painted by the engine) */
.dc-skymode .dc-trackwrap {
  left: 10px;
  right: 10px;
  border-radius: 28px;
  box-shadow:
    0 1px 2px rgb(10 20 40 / 0.08),
    0 18px 36px -18px rgb(10 20 40 / 0.45);
}
.dc-strip {
  position: absolute;
  top: 0;
  pointer-events: none;
}
.dc-skymode .dc-line,
.dc-skymode .dc-band {
  display: none;
}
.dc-skymode .dc-mid,
.dc-skymode .dc-mid.dc-next,
.dc-skymode .dc-mid.dc-era {
  width: auto;
  height: auto;
  margin: 0;
  background: none;
  transform: translateX(-50%);
  pointer-events: none;
}
.dc-skymode .dc-mid span,
.dc-skymode .dc-mid.dc-next span,
.dc-skymode .dc-mid.dc-era span {
  position: static;
  display: block;
  transform: none;
  color: #ffffff;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-shadow: 0 1px 6px rgb(0 0 0 / 0.3);
}
/* a stop: a tile sitting on the line, its time under it, its name for screen readers (and on its card) */
.dc-skymode .dc-node {
  width: 44px;
  height: 44px;
  margin: -22px 0 0 -22px;
}
.dc-skymode .dc-n-ic {
  left: 7px;
  top: 7px;
  margin: 0;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  background: #ffffff;
  box-shadow:
    inset 0 0 0 2px var(--c, #06b0cc),
    0 2px 6px rgb(10 20 40 / 0.22);
  font-size: 16px;
  transition: transform 0.18s ease;
}
.dc-skymode .dc-nt .dc-n-ic {
  background: #14223b;
}
.dc-skymode .dc-fin .dc-n-ic {
  opacity: 0.85;
}
.dc-skymode .dc-fin .dc-n-ic::after {
  content: "✦";
  position: absolute;
  right: -6px;
  top: -9px;
  color: #ffd166;
  font-size: 13px;
  text-shadow: 0 0 2px #f2a93b;
}
.dc-skymode .dc-late .dc-n-ic {
  box-shadow:
    inset 0 0 0 2px #ef4444,
    0 2px 6px rgb(10 20 40 / 0.22);
}
.dc-skymode .dc-late .dc-n-ic::after {
  content: "!";
  position: absolute;
  right: -7px;
  top: -7px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #ef4444;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  line-height: 15px;
  text-align: center;
}
.dc-skymode .dc-sel .dc-n-ic {
  transform: scale(1.14);
  box-shadow:
    inset 0 0 0 2.5px var(--c, #06b0cc),
    0 0 0 4px rgb(255 255 255 / 0.8),
    0 4px 12px rgb(10 20 40 / 0.3);
}
.dc-skymode .dc-n-dot {
  display: none;
}
.dc-skymode .dc-n-t {
  top: 40px;
  left: -24px;
  right: -24px;
  font-size: 0.66rem;
  font-weight: 650;
  color: #ffffff;
  text-shadow: 0 1px 4px rgb(0 0 0 / 0.4);
  white-space: nowrap;
}
.dc-skymode .dc-n-n {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.dc-skymode .dc-n-more {
  top: -9px;
  right: -11px;
  background: #0f1a2a;
  color: #ffffff;
}
.dc-skymode .dc-nt .dc-n-more {
  background: #e6edf8;
  color: #0f1a2a;
}
/* now: the companion standing on the line (a tap folds it all back into the sky) */
.dc-skymode .dc-now.dc-now-sky {
  display: block;
  width: 48px;
  height: 48px;
  transform: translate(-50%, -100%);
}
.dc-skymode .dc-now-sky::after,
.dc-skymode .dc-now-sky i {
  display: none;
}
.dc .dc-now-who {
  position: static;
  inset: auto;
  display: block;
  width: 48px;
  height: 48px;
  image-rendering: pixelated;
}
.dc-now-t {
  position: absolute;
  left: 50%;
  top: calc(100% + 10px);
  transform: translateX(-50%);
  padding: 2px 8px;
  border-radius: 10px;
  background: #0f1a2a;
  color: #ffffff;
  font-size: 0.66rem;
  font-weight: 700;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
/* the day picker, the tiles and the card, in the Day Sky look */
.dc-skymode .dc-days .dc-on {
  background: var(--text);
  color: var(--bg);
}
.dc-skymode .dc-tiles {
  height: 50px;
}
.dc-skymode .dc-tile {
  height: 50px;
  border-radius: 18px;
}
.dc-skymode .dc-tile svg {
  color: var(--sun);
}
.dc-skymode .dc-detail {
  border: 0;
  border-radius: 26px;
  box-shadow: var(--shadow-lift);
}
.dc-skymode .dc-d-ic {
  width: 50px;
  height: 50px;
  border-radius: 16px;
