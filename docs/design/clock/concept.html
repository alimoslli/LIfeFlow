<title>LifeFlow Day Sky</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: the app's Today screen in one phone-width column (top bar, the clock, the ask bar, the tab bar), on the
   app's own tokens from src/app/globals.css, so it looks and reads exactly like LifeFlow in light and dark. */
:root {
  --bg: #f6f8fb;
  --surface: #ffffff;
  --surface-2: #eef2f7;
  --surface-3: #e3e9f1;
  --border: #e3e9f1;
  --border-strong: #c9d3e0;
  --text: #0f1a2a;
  --text-2: #36435a;
  --muted: #5f6b7d;
  /* Official mark palette: moss glass, soft sage highlights, and warm cream. */
  --brand-moss: #285b45;
  --brand-sage: #84a990;
  --brand-mist: #dce9d9;
  --brand-cream: #f8f2e7;
  --accent: #2468c4;
  --accent-hover: #1d58a8;
  --accent-soft: #e3eefb;
  --accent-text: #ffffff;
  /* Feature cards ("Up next", Money): a clear day sky in light, the night sky in dark. */
  --hero: #1f63bd;
  --hero-text: #ffffff;
  --danger: #b42318;
  --danger-soft: #fdecea;
  --warning: #9a5806;
  --warning-soft: #fdf1dc;
  --success: #12704a;
  --success-soft: #e3f3ea;
  --info: #2d5a9e;
  --info-soft: #e7eef9;
  --ring: #2468c466;
  --shadow: 0 1px 2px rgb(15 26 42 / 0.04), 0 8px 24px -6px rgb(15 26 42 / 0.1);
  --shadow-lift: 0 2px 4px rgb(15 26 42 / 0.04), 0 18px 40px -12px rgb(15 26 42 / 0.22);
  /* Chart series (validated pair: CVD ΔE 24.7, contrast >= 3:1) */
  --series-income: #2a78d6;
  --series-spend: #eb6834;
  /* Day Sky: the sun (and the words that go with it), the night */
  --sun: #f5a524;
  --sun-ink: #b45309;
  --night: #07101f;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07101f;
    --surface: #0f1a2e;
    --surface-2: #15223a;
    --surface-3: #1d2c47;
    --border: #1d2c47;
    --border-strong: #2b3d5c;
    --text: #eef3fb;
    --text-2: #c8d3e4;
    --muted: #93a1b7;
    --accent: #7db3f2;
    --accent-hover: #9cc6f6;
    --accent-soft: #15294a;
    --accent-text: #06101f;
    --hero: #0f2a52;
    --hero-text: #eef3fb;
    --danger: #ff9a8e;
    --danger-soft: #3d1c19;
    --warning: #f0bb6c;
    --warning-soft: #362817;
    --success: #7fdcab;
    --success-soft: #16322a;
    --info: #9ec2f5;
    --info-soft: #1a2739;
    --ring: #7db3f266;
    /* Shadows don't read on dark backgrounds; a hairline ring separates surfaces instead. */
    --shadow: 0 0 0 1px rgb(255 255 255 / 0.07), 0 1px 2px rgb(0 0 0 / 0.4);
    --shadow-lift: 0 0 0 1px rgb(255 255 255 / 0.1), 0 18px 40px -12px rgb(0 0 0 / 0.7);
    --series-income: #3987e5;
    --series-spend: #d95926;
    --sun: #f7b955;
    --sun-ink: #ffc56b;
    --night: #050b17;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #07101f;
  --surface: #0f1a2e;
  --surface-2: #15223a;
  --surface-3: #1d2c47;
  --border: #1d2c47;
  --border-strong: #2b3d5c;
  --text: #eef3fb;
  --text-2: #c8d3e4;
  --muted: #93a1b7;
  --accent: #7db3f2;
  --accent-hover: #9cc6f6;
  --accent-soft: #15294a;
  --accent-text: #06101f;
  --hero: #0f2a52;
  --hero-text: #eef3fb;
  --danger: #ff9a8e;
  --danger-soft: #3d1c19;
  --warning: #f0bb6c;
  --warning-soft: #362817;
  --success: #7fdcab;
  --success-soft: #16322a;
  --info: #9ec2f5;
  --info-soft: #1a2739;
  --ring: #7db3f266;
  /* Shadows don't read on dark backgrounds; a hairline ring separates surfaces instead. */
  --shadow: 0 0 0 1px rgb(255 255 255 / 0.07), 0 1px 2px rgb(0 0 0 / 0.4);
  --shadow-lift: 0 0 0 1px rgb(255 255 255 / 0.1), 0 18px 40px -12px rgb(0 0 0 / 0.7);
  --series-income: #3987e5;
  --series-spend: #d95926;
  --sun: #f7b955;
  --sun-ink: #ffc56b;
  --night: #050b17;
  color-scheme: dark;
}
:root {
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Fraunces", ui-serif, Georgia, serif;
  --font-geist-sans: "Geist";
}
[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.app {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 112px;
}
.top {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.top img {
  width: 34px;
  height: 34px;
}
.top-r {
  display: flex;
  margin-right: -10px;
}
.ib {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  color: var(--text);
  border-radius: 22px;
}
.ib svg {
  width: 22px;
  height: 22px;
}
/* the concept bar: what this page is, and a time to see it at */
.concept {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-block: 2px 10px;
}
.concept p {
  margin: 0;
  font-size: 0.78rem;
  line-height: 1.4;
  color: var(--muted);
}
.concept b {
  color: var(--text-2);
  font-weight: 600;
}
.times {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 10px;
}
.times .play {
  width: 40px;
  height: 40px;
  border-radius: 20px;
  background: var(--text);
  color: var(--bg);
  display: grid;
  place-items: center;
}
.times .play svg {
  width: 14px;
  height: 14px;
}
.times output {
  min-width: 64px;
  text-align: right;
  font-size: 0.85rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
input[type="range"].dayslider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 40px;
  background: transparent;
  margin: 0;
}
input[type="range"].dayslider::-webkit-slider-runnable-track {
  height: 12px;
  border-radius: 6px;
  background: var(--track);
}
input[type="range"].dayslider::-moz-range-track {
  height: 12px;
  border-radius: 6px;
  background: var(--track);
}
input[type="range"].dayslider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  margin-top: -6px;
  border-radius: 50%;
  background: #ffd77a;
  border: 3px solid #fff;
  box-shadow: 0 3px 10px rgb(245 165 36 / 0.6);
}
input[type="range"].dayslider::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #ffd77a;
  border: 3px solid #fff;
}
/* the assistant's one line, in the clock's foot (as in the app) */
.ast {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--shadow);
  text-align: left;
  width: 100%;
}
.ast img {
  width: 30px;
  height: 30px;
  flex: none;
}
.ast span {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.ast-k {
  font-size: 0.78rem;
  color: var(--muted);
}
.ast-t {
  font-size: 0.95rem;
  line-height: 1.35;
}
.ast-a {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--accent);
  margin-top: 4px;
}
/* the ask bar and the tab bar, fixed at the bottom like the app shell */
.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.tabs {
  pointer-events: auto;
  max-width: 436px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 6px;
  border-radius: 28px;
  background: var(--surface);
  box-shadow: var(--shadow-lift);
  border: 1px solid var(--border);
}
.tab {
  min-height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-radius: 22px;
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-2);
}
.tab svg {
  width: 22px;
  height: 22px;
}
.tab[aria-current="page"] {
  color: var(--accent);
  background: var(--accent-soft);
}
.ask {
  margin-top: 14px;
  width: 100%;
  min-height: 48px;
  border-radius: 24px;
  padding: 0 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  text-align: left;
  font-size: 0.95rem;
}
/* the pin sheet */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet-back {
  position: absolute;
  inset: 0;
  background: rgb(0 0 0 / 0.35);
}
.sheet-card {
  position: relative;
  width: 100%;
  max-width: 460px;
  max-height: 92%;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow-lift);
  animation: rise 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes rise {
  from {
    transform: translateY(24px);
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .sheet-card {
    animation: none;
  }
}
.grab {
  width: 40px;
  height: 5px;
  border-radius: 3px;
  background: var(--border-strong);
  margin: 0 auto 2px;
}
.sheet h2 {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 600;
}
.pin-row {
  display: flex;
  gap: 12px;
  align-items: center;
}
.pin-ic {
  width: 48px;
  height: 48px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: var(--surface-2);
  font-size: 1.5rem;
}
.field {
  min-height: 48px;
  min-width: 0;
  flex: 1;
  border-radius: 16px;
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--text);
  padding: 0 14px;
  font: inherit;
  font-size: 1rem;
}
.emojis {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-inline: -20px;
  padding-inline: 20px;
}
.emojis::-webkit-scrollbar {
  display: none;
}
.emojis button {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  font-size: 1.4rem;
}
.emojis button[aria-checked="true"] {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.kinds {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.kinds button {
  min-height: 56px;
  padding: 8px 12px;
  border-radius: 16px;
  background: var(--surface-2);
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.kinds b {
  font-size: 0.92rem;
  font-weight: 600;
}
.kinds small {
  font-size: 0.74rem;
  color: var(--muted);
}
.kinds button[aria-checked="true"] {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.when {
  display: flex;
  gap: 10px;
}
.when label {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.8rem;
  color: var(--muted);
}
.acts {
  display: flex;
  gap: 10px;
}
.acts button {
  flex: 1;
  min-height: 48px;
  border-radius: 24px;
  font-weight: 600;
  background: var(--surface-2);
}
.acts .primary {
  background: var(--accent);
  color: var(--accent-text);
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 50;
  max-width: min(420px, calc(100% - 32px));
  padding: 12px 16px;
  border-radius: 16px;
  background: var(--text);
  color: var(--bg);
  font-size: 0.88rem;
  line-height: 1.35;
  box-shadow: var(--shadow-lift);
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
/* ---- Today: src/components/day-clock/day-clock.css, as the app ships it ---- */
/* Today (v3 Day Sky): the sky (sky.ts) and the timeline it pours into (engine.ts). Page colours are the app's theme
   tokens; the sky and the timeline's window have their own, the colours of the real sky. */
.dc {
  position: relative;
  /* the sky reaches up behind the top bar, so Today only clips sideways */
  overflow-x: clip;
  overflow-y: visible;
  /* Phones: the whole screen between the top bar and the tab bar (the assistant's line sits inside, at the foot). */
  height: clamp(500px, calc(100svh - 168px), 720px);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  color: var(--text);
}
@media (min-width: 768px) {
  .dc {
    height: 620px;
  }
}
/* Only Today's own buttons are reset; anything placed in the foot keeps its own styles. */
:where(.dc-sub, .dc-tiles, .dc-track, .dc-detail) button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
.dc button:focus-visible,
.dc [role="button"]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.dc-hap {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}

/* ---- the sky: full width, stars and clouds; it folds into the timeline's window as it opens ---- */
.dc-skybg {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.dc-stars {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.dc-stars circle {
  fill: #ffffff;
  animation: dc-tw 3.2s ease-in-out infinite alternate;
}
@keyframes dc-tw {
  from {
    opacity: 0.25;
  }
  to {
    opacity: 1;
  }
}
.dc-cloud {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgb(255 255 255 / 0.85), rgb(255 255 255 / 0));
  animation: dc-drift 60s linear infinite alternate;
}
.dc-cloud-b {
  animation-duration: 80s;
  animation-direction: alternate-reverse;
}
@keyframes dc-drift {
  from {
    transform: translateX(-30px);
  }
  to {
    transform: translateX(40px);
  }
}
@media (prefers-reduced-motion: reduce) {
  .dc-stars circle,
  .dc-cloud {
    animation: none;
  }
}
/* Today's path, tiles and stars (sky.ts), above the timeline's window while it pours */
.dc-dome {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  overflow: visible;
}
.dc-dome .dc-pill-t {
  font-weight: 650;
  fill: #0f1a2a;
}
.dc-dome .dc-badge {
  fill: #0f1a2a;
}
.dc-dome .dc-badge-t,
.dc-dome .dc-late-t {
  font-size: 10px;
  font-weight: 700;
  fill: #ffffff;
}
.dc-dome .dc-end {
  font-size: 11.5px;
  font-weight: 600;
  fill: var(--text);
  opacity: 0.72;
}
.dc-dome .dc-stars-t {
  font-size: 12.5px;
  font-weight: 650;
  fill: #eef3fb;
}
.dc[data-sky="night"] .dc-dome .dc-pill-t,
.dc[data-sky="night"] .dc-dome .dc-end {
  fill: #eef3fb;
}
.dc[data-sky="night"] .dc-dome .dc-badge {
  fill: #e6edf8;
}
.dc[data-sky="night"] .dc-dome .dc-badge-t {
  fill: #0f1a2a;
}
.dc .dc-who {
  position: absolute;
  left: 0;
  top: 0;
  width: 48px;
  height: 48px;
  z-index: 6;
  pointer-events: none;
  image-rendering: pixelated;
}
/* under the horizon, in words */
.dc-words {
  position: absolute;
  left: 20px;
  right: 20px;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  pointer-events: none;
}
.dc-w-tag {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--sun-ink);
}
.dc-w-now {
  margin-top: 6px;
  max-width: 100%;
  font-family: var(--font-display);
  font-size: 1.95rem;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.1;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-wrap: balance;
}
.dc-w-then {
  margin-top: 6px;
  font-size: 0.9rem;
  color: var(--muted);
}
.dc-w-pills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
}
.dc-w-pills span {
  height: 32px;
  padding: 0 12px;
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow);
  display: inline-flex;
  align-items: center;
  font-size: 0.84rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.dc-w-after {
  margin-top: 12px;
  font-size: 0.8rem;
  color: var(--muted);
}
/* the top bar over the sky (Today, closed): light icons on a dark sky */
html[data-sky="dark"] .lf-appbar:not(.lf-appbar-scrolled),
html[data-sky="dark"] .lf-appbar:not(.lf-appbar-scrolled) .text-text-2 {
  color: #eef3fb;
}
/* the whole sky is the place to tap */
.dc-hit {
  position: absolute;
  z-index: 7;
  border-radius: 28px;
  touch-action: pan-y;
  cursor: pointer;
}
.dc-hint {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 6;
  text-align: center;
  font-size: 0.8rem;
  color: var(--muted);
  pointer-events: none;
  opacity: 0;
}
.dc-foot {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 8px;
  max-width: 560px;
  margin: 0 auto;
  z-index: 8;
}
.dc-foot:empty {
  display: none;
}

/* ---- "Today" on the sky, and the day picker once it's open ---- */
.dc-sub {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 44px;
  z-index: 8;
}
.dc-todaybtn {
  position: absolute;
  left: 20px;
  top: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--sky-ink, var(--text));
  font-family: var(--font-display);
  font-size: 1.65rem;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.dc-days {
  position: absolute;
  inset: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  opacity: 0;
  pointer-events: none;
}
/* Every button is a real 44 px box; the pill you see is the middle 36 px (transparent borders above and below). */
.dc-days button {
  position: relative;
  height: 44px;
  min-width: 44px;
  padding: 0 6px;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;

  border-radius: 22px;
  font-size: 0.95rem;
  display: grid;
  place-items: center;

}
.dc-days .dc-arrow {
  color: var(--muted);
  min-width: 44px;
  padding: 0;
  flex: none;
}
.dc-days .dc-on {
  background: var(--text);
  color: var(--bg);
  font-weight: 600;
  padding: 0 13px;
  flex: none;
}
@media (min-width: 768px) {
  .dc-days {
    justify-content: center;
    gap: 14px;
  }
}

/* ---- the timeline: a window onto the sky, a hill for every day and a valley for every night ---- */
.dc-trackwrap {
  position: absolute;
  left: 10px;
  right: 10px;
  z-index: 5;
  border-radius: 28px;
  overflow-x: auto;
  overflow-y: hidden;
  touch-action: pan-x;
  scrollbar-width: none;
  overscroll-behavior-x: contain;
  pointer-events: none;
  box-shadow:
    0 1px 2px rgb(10 20 40 / 0.08),
    0 18px 36px -18px rgb(10 20 40 / 0.45);
}
.dc-trackwrap::-webkit-scrollbar {
  display: none;
}
.dc[data-open="true"] .dc-trackwrap,
.dc[data-open="true"] .dc-days,
.dc[data-open="true"] .dc-tiles,
.dc[data-open="true"] .dc-detail {
  pointer-events: auto;
}
.dc-track {
  position: relative;
  height: 100%;
}
.dc[data-state="timeline"] .dc-track {
  cursor: copy;
}
.dc[data-state="timeline"] .dc-track :is(.dc-node, .dc-now) {
  cursor: pointer;
}
.dc-strip {
  position: absolute;
  top: 0;
  pointer-events: none;
}
/* the line and its stops arrive last as the window opens (--tline, set by the engine) */
.dc-strip-line,
.dc-mid,
.dc-node,
.dc-now {
  opacity: var(--tline, 1);
}
/* a day's name under its hill; a month, a year or "Someday" further out */
.dc-mid {
  position: absolute;
  transform: translateX(-50%);
  pointer-events: none;
}
.dc-mid span {
  display: block;
  color: #ffffff;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  white-space: nowrap;
  text-shadow: 0 1px 6px rgb(0 0 0 / 0.3);
}
/* a stop: a tile sitting on the line, its time under it, its name for screen readers (and on its card) */
.dc-node {
  position: absolute;
  width: 44px;
  height: 44px;
  margin: -22px 0 0 -22px;
  display: block;
}
.dc-n-ic {
  position: absolute;
  left: 7px;
  top: 7px;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: #ffffff;
  box-shadow:
    inset 0 0 0 2px var(--c, #06b0cc),
    0 2px 6px rgb(10 20 40 / 0.22);
  font-size: 16px;
  line-height: 1;
  transition: transform 0.18s ease;
}
.dc-nt .dc-n-ic {
  background: #14223b;
}
.dc-fin .dc-n-ic {
  opacity: 0.85;
}
.dc-fin .dc-n-ic::after {
  content: "✦";
  position: absolute;
  right: -6px;
  top: -9px;
  color: #ffd166;
  font-size: 13px;
  text-shadow: 0 0 2px #f2a93b;
}
.dc-late .dc-n-ic {
  box-shadow:
    inset 0 0 0 2px #ef4444,
    0 2px 6px rgb(10 20 40 / 0.22);
}
.dc-late .dc-n-ic::after {
  content: "!";
  position: absolute;
  right: -7px;
  top: -7px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #ef4444;
  color: #ffffff;
  font-size: 10px;
  font-weight: 800;
  line-height: 15px;
  text-align: center;
}
.dc-sel .dc-n-ic {
  transform: scale(1.14);
  box-shadow:
    inset 0 0 0 2.5px var(--c, #06b0cc),
    0 0 0 4px rgb(255 255 255 / 0.8),
    0 4px 12px rgb(10 20 40 / 0.3);
}
.dc-n-dot {
  display: none;
}
.dc-n-t {
  position: absolute;
  top: 40px;
  left: -24px;
  right: -24px;
  text-align: center;
  font-size: 0.66rem;
  font-weight: 650;
  color: #ffffff;
  text-shadow: 0 1px 4px rgb(0 0 0 / 0.4);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.dc-n-n {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
/* "+2" on a stack's tile */
.dc-n-more {
  position: absolute;
  top: -9px;
  right: -11px;
  min-width: 20px;
  padding: 1px 5px;
  border-radius: 10px;
  background: #0f1a2a;
  color: #ffffff;
  font-size: 0.65rem;
  font-weight: 700;
  line-height: 16px;
  text-align: center;
}
.dc-nt .dc-n-more {
  background: #e6edf8;
  color: #0f1a2a;
}
/* now: the companion standing on the line (a tap folds it all back into the sky) */
.dc-now {
  position: absolute;
  width: 48px;
  height: 48px;
  transform: translate(-50%, -100%);
}
.dc-now-who {
  display: block;
  width: 48px;
  height: 48px;
  image-rendering: pixelated;
}
.dc-now-t {
  position: absolute;
  left: 50%;
  top: calc(100% + 10px);
  transform: translateX(-50%);
  padding: 2px 8px;
  border-radius: 10px;
  background: #0f1a2a;
  color: #ffffff;
  font-size: 0.66rem;
  font-weight: 700;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* ---- the tiles: the day's shift, class and deadline ---- */
.dc-tiles {
  position: absolute;
  left: 0;
  right: 0;
  height: 50px;
  display: flex;
  justify-content: center;
  gap: 8px;
  z-index: 8;
  padding: 0 16px;
  pointer-events: none;
}
.dc-tile {
  flex: 1 1 0;
  max-width: 160px;
  height: 50px;
  padding: 0 12px;
  border-radius: 18px;
  background: var(--surface);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  opacity: 0;
}
.dc-tile svg {
  flex: none;
  width: 20px;
  height: 20px;
  color: var(--sun);
}
.dc-tx {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.dc-tn {
  font-size: 0.72rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dc-tt {
  font-size: 0.95rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}
.dc-tile[aria-pressed="true"] {
  box-shadow: inset 0 0 0 1.5px var(--accent);
}
/* Phones: seven days fit as 44 px targets without the arrows (tap a day, or scroll the line). */
@media (max-width: 520px) {
  .dc-days .dc-arrow {
    display: none;
  }
}
@media (max-width: 380px) {
  .dc-days {
    inset: 0 6px;
  }
  .dc-days button {
    font-size: 0.9rem;
  }
  .dc-days .dc-on {
    padding: 0 10px;
  }
  .dc-tiles {
    gap: 6px;
    padding: 0 12px;
  }
  .dc-tile {
    padding: 0 10px;
    gap: 8px;
  }
  .dc-tile svg {
    width: 18px;
    height: 18px;
  }
}

/* ---- one quiet card, on a tap ---- */
.dc-detail:empty {
  display: none;
}
.dc-detail {
  position: absolute;
  left: 16px;
  right: 16px;
  max-width: 520px;
  margin: 0 auto;
  z-index: 8;
  background: var(--surface);
  box-shadow: var(--shadow-lift);
  border-radius: 26px;
  padding: 16px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  opacity: 0;
  pointer-events: none;
}
.dc-d-ic {
  width: 50px;
  height: 50px;
  border-radius: 16px;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 25px;
  flex: none;
}
.dc-d-body {
  min-width: 0;
  flex: 1;
}
.dc-d-k {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--sun-ink);
  margin-bottom: 3px;
}
.dc-d-t {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.dc-d-w {
  font-size: 0.9rem;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.dc-d-s {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.35;
}
.dc-d-s:empty {
  display: none;
}
/* a stack's card: one row per thing, each a full-width 44 px tap */
.dc-d-list {
  display: flex;
  flex-direction: column;
  max-height: 200px;
  margin: 6px -8px 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.dc .dc-d-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  padding: 0 8px;
  border-radius: 12px;
  text-align: left;
  color: var(--text);
}
.dc .dc-d-row:active {
  background: var(--surface-2);
}
.dc-r-ic {
  font-size: 1.1rem;
}
.dc-r-n {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  font-size: 0.9rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dc-r-t {
  color: var(--muted);
  font-size: 0.8rem;
  font-variant-numeric: tabular-nums;
}
.dc-d-acts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.dc .dc-d-done,
.dc .dc-d-edit,
.dc .dc-d-open {
  height: 44px;
  padding: 0 16px;
  border-radius: 15px;
  font-size: 0.85rem;
  font-weight: 600;
}
.dc .dc-d-done {
  background: var(--text);
  color: var(--bg);
}
.dc .dc-d-edit,
.dc .dc-d-open {
  background: color-mix(in srgb, var(--text) 7%, transparent);
  color: var(--text);
}

/* ---- "Pin something": under the tiles while the timeline is open and no card is showing ---- */
.dc-pinbar {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 8;
  display: flex;
  justify-content: center;
  visibility: hidden;
}
.dc[data-state="timeline"] .dc-pinbar {
  visibility: visible;
}
.dc-detail:not(:empty) ~ .dc-pinbar {
  display: none;
}
.dc-pinbar button {
  min-height: 44px;
  padding: 0 18px;

  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow);
  font-size: 0.9rem;
  font-weight: 600;
}

/* in this page the concept bar sits above the clock, so the clock gives it that room */
.dc {
  height: clamp(500px, calc(100svh - 240px), 720px);
}

<div id="pin" class="sheet" hidden>
  <div id="pin-back" class="sheet-back"></div>
  <form id="pin-form" class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="pin-h">
    <div class="grab" aria-hidden="true"></div>
    <h2 id="pin-h">Pin to your timeline</h2>
    <div class="pin-row">
      <span id="pin-icon" class="pin-ic" aria-hidden="true">📌</span>
      <input id="pin-name" class="field" aria-label="Name" placeholder="What is it?" maxlength="180" required autocomplete="off">
    </div>

    <div class="kinds" role="radiogroup" aria-label="What it is">
      <button type="button" role="radio" data-kind="todo" aria-checked="true"><b>To-do</b><small>Something to do by then</small></button>
      <button type="button" role="radio" data-kind="plan" aria-checked="false"><b>Plan</b><small>Somewhere to be, for an hour</small></button>
      <button type="button" role="radio" data-kind="goal" aria-checked="false"><b>Goal</b><small>Something to reach by that day</small></button>
      <button type="button" role="radio" data-kind="milestone" aria-checked="false"><b>Milestone</b><small>Something that happened</small></button>
    </div>
    <div class="when">
      <label for="pin-date">Day<input id="pin-date" class="field" type="date" required></label>
      <label id="pin-time-wrap" for="pin-time">Time<input id="pin-time" class="field" type="time"></label>
    </div>
    <div class="acts">
      <button type="button" id="pin-cancel">Cancel</button>
      <button type="submit" class="primary">Pin it</button>

  </form>
</div>
