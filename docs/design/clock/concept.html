<title>LifeFlow Day Clock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Layout: the app's Today screen in one phone-width column (top bar, the clock, the ask bar, the tab bar), on the
   app's own tokens from src/app/globals.css, so it looks and reads exactly like LifeFlow in light and dark. */
:root {
  --bg: #f6f2e9;
  --surface: #fffef9;
  --surface-2: #f1ede3;
  --surface-3: #e9e3d6;
  --border: #e4ddcf;
  --border-strong: #d2cabb;
  --text: #1b1a17;
  --text-2: #4a4740;
  --muted: #69655c;
  /* Official mark palette: moss glass, soft sage highlights, and warm cream. */
  --brand-moss: #285b45;
  --brand-sage: #84a990;
  --brand-mist: #dce9d9;
  --brand-cream: #f8f2e7;
  --accent: var(--brand-moss);
  --accent-hover: #1f4b39;
  --accent-soft: #e2eee3;
  --accent-text: #ffffff;
  /* Deep-green feature cards ("Up next", Money). Stay deep green in both themes. */
  --hero: #285b45;
  --hero-text: #ffffff;
  --danger: #b42318;
  --danger-soft: #fdecea;
  --warning: #9a5806;
  --warning-soft: #fdf1dc;
  --success: #12704a;
  --success-soft: #e3f3ea;
  --info: #2d5a9e;
  --info-soft: #e7eef9;
  --ring: #285b4566;
  --shadow: 0 1px 2px rgb(40 34 20 / 0.04), 0 8px 24px -6px rgb(40 34 20 / 0.08);
  --shadow-lift: 0 2px 4px rgb(40 34 20 / 0.04), 0 18px 40px -12px rgb(40 34 20 / 0.18);
  /* Chart series (validated pair: CVD ΔE 24.7, contrast >= 3:1) */
  --series-income: #2a78d6;
  --series-spend: #eb6834;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e0d;
    --surface: #1a1a18;
    --surface-2: #242421;
    --surface-3: #31302c;
    --border: #33322e;
    --border-strong: #4a4842;
    --text: #f3f1ec;
    --text-2: #d3cfc6;
    --muted: #a8a49a;
    --accent: #8ccbb4;
    --accent-hover: #a2d8c4;
    --accent-soft: #1d322b;
    --accent-text: #0c1b16;
    --hero: #21493d;
    --hero-text: #f3f8f5;
    --danger: #ff9a8e;
    --danger-soft: #3d1c19;
    --warning: #f0bb6c;
    --warning-soft: #362817;
    --success: #7fdcab;
    --success-soft: #16322a;
    --info: #9ec2f5;
    --info-soft: #1a2739;
    --ring: #8ccbb466;
    /* Shadows don't read on dark backgrounds; a hairline ring separates surfaces instead. */
    --shadow: 0 0 0 1px rgb(255 255 255 / 0.07), 0 1px 2px rgb(0 0 0 / 0.4);
    --shadow-lift: 0 0 0 1px rgb(255 255 255 / 0.1), 0 18px 40px -12px rgb(0 0 0 / 0.7);
    --series-income: #3987e5;
    --series-spend: #d95926;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0e0e0d;
  --surface: #1a1a18;
  --surface-2: #242421;
  --surface-3: #31302c;
  --border: #33322e;
  --border-strong: #4a4842;
  --text: #f3f1ec;
  --text-2: #d3cfc6;
  --muted: #a8a49a;
  --accent: #8ccbb4;
  --accent-hover: #a2d8c4;
  --accent-soft: #1d322b;
  --accent-text: #0c1b16;
  --hero: #21493d;
  --hero-text: #f3f8f5;
  --danger: #ff9a8e;
  --danger-soft: #3d1c19;
  --warning: #f0bb6c;
  --warning-soft: #362817;
  --success: #7fdcab;
  --success-soft: #16322a;
  --info: #9ec2f5;
  --info-soft: #1a2739;
  --ring: #8ccbb466;
  /* Shadows don't read on dark backgrounds; a hairline ring separates surfaces instead. */
  --shadow: 0 0 0 1px rgb(255 255 255 / 0.07), 0 1px 2px rgb(0 0 0 / 0.4);
  --shadow-lift: 0 0 0 1px rgb(255 255 255 / 0.1), 0 18px 40px -12px rgb(0 0 0 / 0.7);
  --series-income: #3987e5;
  --series-spend: #d95926;
  color-scheme: dark;
}
:root {
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.app {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 112px;
}
.top {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.top img {
  width: 34px;
  height: 34px;
}
.top-r {
  display: flex;
  margin-right: -10px;
}
.ib {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  color: var(--text);
  border-radius: 22px;
}
.ib svg {
  width: 22px;
  height: 22px;
}
/* the concept bar: what this page is, and a time to see it at */
.concept {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-block: 2px 10px;
}
.concept p {
  margin: 0;
  font-size: 0.78rem;
  line-height: 1.4;
  color: var(--muted);
}
.concept b {
  color: var(--text-2);
  font-weight: 600;
}
.times {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-inline: -4px;
  padding-inline: 4px;
}
.times::-webkit-scrollbar {
  display: none;
}
.times button {
  flex: none;
  min-height: 34px;
  padding: 0 10px;
  border-radius: 17px;
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 0.8rem;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.times button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--accent-text);
}
/* the assistant's one line, in the clock's foot (as in the app) */
.ast {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--shadow);
  text-align: left;
  width: 100%;
}
.ast img {
  width: 30px;
  height: 30px;
  flex: none;
}
.ast span {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.ast-k {
  font-size: 0.78rem;
  color: var(--muted);
}
.ast-t {
  font-size: 0.95rem;
  line-height: 1.35;
}
.ast-a {
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--accent);
  margin-top: 4px;
}
/* the ask bar and the tab bar, fixed at the bottom like the app shell */
.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.tabs {
  pointer-events: auto;
  max-width: 436px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 6px;
  border-radius: 28px;
  background: var(--surface);
  box-shadow: var(--shadow-lift);
  border: 1px solid var(--border);
}
.tab {
  min-height: 52px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-radius: 22px;
  font-size: 0.72rem;
  font-weight: 500;
  color: var(--text-2);
}
.tab svg {
  width: 22px;
  height: 22px;
}
.tab[aria-current="page"] {
  color: var(--accent);
  background: var(--accent-soft);
}
.ask {
  margin-top: 14px;
  width: 100%;
  min-height: 48px;
  border-radius: 24px;
  padding: 0 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  text-align: left;
  font-size: 0.95rem;
}
/* the pin sheet */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet-back {
  position: absolute;
  inset: 0;
  background: rgb(0 0 0 / 0.35);
}
.sheet-card {
  position: relative;
  width: 100%;
  max-width: 460px;
  max-height: 92%;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 26px 26px 0 0;
  padding: 10px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow-lift);
  animation: rise 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes rise {
  from {
    transform: translateY(24px);
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .sheet-card {
    animation: none;
  }
}
.grab {
  width: 40px;
  height: 5px;
  border-radius: 3px;
  background: var(--border-strong);
  margin: 0 auto 2px;
}
.sheet h2 {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 600;
}
.pin-row {
  display: flex;
  gap: 12px;
  align-items: center;
}
.pin-ic {
  width: 48px;
  height: 48px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 16px;
  background: var(--surface-2);
  font-size: 1.5rem;
}
.field {
  min-height: 48px;
  min-width: 0;
  flex: 1;
  border-radius: 16px;
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--text);
  padding: 0 14px;
  font: inherit;
  font-size: 1rem;
}
.emojis {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  margin-inline: -20px;
  padding-inline: 20px;
}
.emojis::-webkit-scrollbar {
  display: none;
}
.emojis button {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  font-size: 1.4rem;
}
.emojis button[aria-checked="true"] {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.kinds {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.kinds button {
  min-height: 56px;
  padding: 8px 12px;
  border-radius: 16px;
  background: var(--surface-2);
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.kinds b {
  font-size: 0.92rem;
  font-weight: 600;
}
.kinds small {
  font-size: 0.74rem;
  color: var(--muted);
}
.kinds button[aria-checked="true"] {
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.when {
  display: flex;
  gap: 10px;
}
.when label {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.8rem;
  color: var(--muted);
}
.acts {
  display: flex;
  gap: 10px;
}
.acts button {
  flex: 1;
  min-height: 48px;
  border-radius: 24px;
  font-weight: 600;
  background: var(--surface-2);
}
.acts .primary {
  background: var(--accent);
  color: var(--accent-text);
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 50;
  max-width: min(420px, calc(100% - 32px));
  padding: 12px 16px;
  border-radius: 16px;
  background: var(--text);
  color: var(--bg);
  font-size: 0.88rem;
  line-height: 1.35;
  box-shadow: var(--shadow-lift);
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}
/* ---- the day clock: src/components/day-clock/day-clock.css, as the app ships it ---- */
/* The day clock (v3 home). Colours are the app's theme tokens, so it reads the same in light and dark:
   one accent (the moss/mint green) for everything busy, the text colour for the face. */
.dc {
  position: relative;
  overflow: hidden;
  /* Phones: the whole screen between the top bar and the tab bar (the assistant's line sits inside, at the foot). */
  height: clamp(500px, calc(100svh - 168px), 720px);
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  color: var(--text);
}
@media (min-width: 768px) {
  .dc {
    height: 620px;
  }
}
/* Only the clock's own buttons are reset; anything placed in the foot keeps its own styles. */
:where(.dc-sub, .dc-tiles, .dc-track, .dc-detail) button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
.dc button:focus-visible,
.dc [role="button"]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
.dc canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}
.dc > svg {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  overflow: visible;
}
.dc-callouts,
.dc-micons {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.dc-callouts {
  z-index: 3;
}
.dc-micons {
  z-index: 4;
}
.dc-probe,
.dc-hap {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
}

/* the face */
.dc-rim {
  fill: none;
  stroke: color-mix(in srgb, var(--text) 22%, transparent);
  stroke-width: 2;
  stroke-linecap: round;
}
.dc-arc,
.dc-arc-glow {
  fill: none;
  stroke: var(--accent);
  stroke-linecap: round;
}
.dc-arc {
  stroke-width: 3;
}
.dc-arc-glow {
  stroke-width: 5;
}
.dc-num {
  fill: var(--text);
  font-size: 18px;
  font-weight: 650;
}
.dc-tick {
  stroke: color-mix(in srgb, var(--text) 70%, transparent);
  stroke-width: 2;
  stroke-linecap: round;
}
/* the outer ring (the 12 hours after the next 12), the seam at the hand, and tomorrow's tint */
.dc-outer-ring {
  fill: none;
  stroke: color-mix(in srgb, var(--text) 13%, transparent);
  stroke-width: 2;
}
.dc-tmrw-track {
  fill: none;
  stroke: color-mix(in srgb, var(--accent) 30%, transparent);
  stroke-width: 2;
  stroke-linecap: round;
}
.dc-seam {
  stroke: color-mix(in srgb, var(--text) 45%, transparent);
  stroke-width: 2;
  stroke-linecap: round;
}
/* markers on the outer ring: later, so a little quieter */
.dc-co.dc-later {
  font-size: 0.74rem;
  color: var(--text-2);
}
/* tomorrow's ring: just outside the clock, from the 12 round to the hand */
.dc-tmrw-ring {
  fill: none;
  stroke: color-mix(in srgb, var(--accent) 34%, transparent);
  stroke-width: 2;
  stroke-linecap: round;
}
.dc-tmrw-end {
  fill: color-mix(in srgb, var(--accent) 55%, transparent);
}
.dc-face-tag {
  fill: var(--accent);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  stroke: var(--bg);
  stroke-width: 4;
  stroke-linejoin: round;
  paint-order: stroke;
}
.dc-face-now {
  fill: var(--text);
  font-size: 12.5px;
  font-weight: 600;
  stroke: var(--bg);
  stroke-width: 4;
  stroke-linejoin: round;
  paint-order: stroke;
}
.dc-step {
  stroke: var(--accent);
  stroke-width: 2.4;
  stroke-linecap: round;
}
.dc-accent-fill {
  fill: var(--accent);
}
.dc-word {
  fill: var(--accent);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 1.6px;
}
.dc-hour,
.dc-minute {
  stroke: var(--text);
  stroke-linecap: round;
}
.dc-hour {
  stroke-width: 5;
}
.dc-minute {
  stroke-width: 3.2;
}
.dc-hub {
  fill: var(--text);
}
.dc-leader {
  stroke: color-mix(in srgb, var(--text) 38%, transparent);
  stroke-width: 1;
}
.dc-steps {
  fill: var(--muted);
  font-size: 11.5px;
  stroke: var(--bg);
  stroke-width: 4;
  stroke-linejoin: round;
  paint-order: stroke;
}
.dc-steps-n {
  fill: var(--text);
  font-weight: 600;
}
.dc-halo {
  fill: none;
  stroke: var(--accent);
  stroke-width: 10;
}
.dc-press-ring {
  fill: none;
  stroke: var(--accent);
  stroke-opacity: 0.55;
  stroke-width: 1.5;
}
.dc-stop-a {
  stop-color: var(--accent);
  stop-opacity: 0.34;
}
.dc-stop-b {
  stop-color: var(--accent);
  stop-opacity: 0.2;
}
.dc-stop-c {
  stop-color: var(--accent);
  stop-opacity: 0.1;
}

/* markers around the rim */
.dc-co {
  position: absolute;
  left: 0;
  top: 0;
  font-size: 0.8rem;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.dc-tm {
  display: block;
  margin-top: 1px;
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
}
.dc-mi {
  position: absolute;
  left: 0;
  top: 0;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  font-size: 26px;
  line-height: 1;
  will-change: transform;
}
.dc-hit {
  position: absolute;
  z-index: 7;
  border-radius: 50%;
  touch-action: pan-y;
  cursor: pointer;
}
.dc-hint {
  position: absolute;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 0.8rem;
  color: var(--muted);
  z-index: 3;
  pointer-events: none;
}
.dc-foot {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 8px;
  max-width: 560px;
  margin: 0 auto;
  z-index: 8;
}
.dc-foot:empty {
  display: none;
}
/* "Pin something": under the tiles while the timeline is open and no card is showing */
.dc-pinbar {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 8;
  display: flex;
  justify-content: center;
  visibility: hidden;
}
.dc[data-state="timeline"] .dc-pinbar {
  visibility: visible;
}
.dc-detail:not(:empty) ~ .dc-pinbar {
  display: none;
}
.dc-pinbar button {
  min-height: 44px;
  padding: 0 18px;
  border-radius: 22px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 0.9rem;
  font-weight: 600;
}
.dc-hint-wrap {
  z-index: 6;
  opacity: 0;
}

/* "Today ⌄" and the day picker */
.dc-sub {
  position: absolute;
  left: 0;
  right: 0;
  height: 44px;
  z-index: 8;
}
.dc-todaybtn {
  position: absolute;
  left: 20px;
  top: 0;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 1.15rem;
  font-weight: 500;
}
.dc-days {
  position: absolute;
  inset: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  opacity: 0;
  pointer-events: none;
}
/* Every button is a real 44 px box; the pill you see is the middle 36 px (transparent borders above and below). */
.dc-days button {
  position: relative;
  height: 44px;
  min-width: 44px;
  padding: 0 6px;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  background-clip: padding-box;
  border-radius: 22px;
  font-size: 0.95rem;
  display: grid;
  place-items: center;
  white-space: nowrap;
}
.dc-days .dc-arrow {
  color: var(--muted);
  min-width: 44px;
  padding: 0;
  flex: none;
}

  <h1 class="vh">LifeFlow v3: Today as a day clock</h1>
  <div class="concept">
    <p><b>v3 concept.</b> A made-up student's week on your own clock. Tap the clock, pin things. Nothing is saved.</p>
    <div class="times" role="group" aria-label="See it at a time of day">
      <button type="button" data-at="" aria-pressed="true">Now</button>
      <button type="button" data-at="07:00" aria-pressed="false">7 AM</button>
      <button type="button" data-at="09:00" aria-pressed="false">9 AM</button>
      <button type="button" data-at="13:00" aria-pressed="false">1 PM</button>
      <button type="button" data-at="18:00" aria-pressed="false">6 PM</button>
      <button type="button" data-at="22:30" aria-pressed="false">10:30 PM</button>
    </div>
  </div>

  <div class="dc" data-open="false">
    <canvas data-dc="goo" aria-hidden="true"></canvas>
    <svg data-dc="face" aria-hidden="true">
      <defs>
        <radialGradient id="dc-press">
          <stop offset="0" class="dc-stop-a" />
          <stop offset=".8" class="dc-stop-b" />
          <stop offset="1" class="dc-stop-c" />
        </radialGradient>
        <filter id="dc-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" /></filter>
        <filter id="dc-halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12" /></filter>
      </defs>
      <g data-dc="leaders"></g>
      <g data-dc="faceG">
        <circle data-dc="halo" class="dc-halo" filter="url(#dc-halo)" opacity="0" />
        <g data-dc="press" opacity="0">
          <circle fill="url(#dc-press)" />
          <circle class="dc-press-ring" />
        </g>
        <path data-dc="rim" class="dc-rim" />
        <g data-dc="arcs"></g>
        <g data-dc="ticks"></g>
        <g data-dc="day"></g>
        <g data-dc="hands">
          <line data-dc="hour" class="dc-hour" />
          <line data-dc="minute" class="dc-minute" />
          <circle data-dc="hub" class="dc-hub" r="4.2" />
        </g>
        <g data-dc="steps"></g>
      </g>
    </svg>

    <div data-dc="micons" class="dc-micons" aria-hidden="true"></div>

      </button>
