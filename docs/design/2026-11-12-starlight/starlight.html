<title>Starlight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Geist:wght@400;600;800&display=swap">
<style>
/* Layout: the night sky is the whole screen (a canvas); one score on top; frosted night-glass cards over it. */
:root {
  --night: #152643;
  --glass: rgba(21, 38, 67, 0.7);
  --edge: rgba(255, 255, 255, 0.16);
  --text: #f6f8fb;
  --muted: #b9c7dd;
  --star: #ffdc6e;
  --star-deep: #dcae35;
  --ink: #262320;
  --good: #86d3a0;
  --font-display: "Fraunces", ui-serif, Georgia, serif;
  --font-body: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--text); font-family: var(--font-body);
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--star); outline-offset: 2px; }

#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 2; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: start;
}
.iconbtn {
  pointer-events: auto; width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--edge);
  background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; place-items: center; padding: 0;
}
.pausebars { width: 12px; height: 14px; border-left: 4px solid var(--text); border-right: 4px solid var(--text); box-sizing: border-box; }
.score { text-align: center; text-shadow: 0 2px 0 rgba(10, 18, 36, 0.45); }
#score { font: 800 2.25rem/1 var(--font-body); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; display: inline-flex; align-items: center; gap: 8px; }
#score canvas { width: 28px; height: 28px; image-rendering: pixelated; }
#best { display: block; margin-top: 4px; font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.2em; }
#score.bump { animation: bump 0.22s ease-out; }
@keyframes bump { 45% { transform: scale(1.12); } }

.overlay {
  position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; box-sizing: border-box; overflow-y: auto;
  padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  width: 100%; max-width: 400px; box-sizing: border-box; padding: 24px 20px 18px; border-radius: 26px; margin: auto;
  background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 20px 60px rgba(5, 12, 28, 0.35); display: grid; gap: 16px; text-align: center;
}
.card .hero { justify-self: center; width: 96px; height: 96px; image-rendering: pixelated; }
h1 { margin: 0; font: 800 clamp(2.4rem, 12vw, 3.25rem)/0.95 var(--font-display); letter-spacing: -0.02em; }
h2 { margin: 0; font: 600 1.375rem/1.2 var(--font-display); text-wrap: balance; }
p { margin: 0; line-height: 1.45; color: var(--muted); }
.lead { font-size: 1.0625rem; color: var(--text); text-wrap: balance; }
.btn {
  min-height: 54px; border-radius: 16px; border: 0; font-weight: 800; font-size: 1.0625rem;
  background: var(--star); color: var(--ink); box-shadow: 0 4px 0 var(--star-deep); transition: transform 0.08s, box-shadow 0.08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--star-deep); }
.btn.ghost { background: rgba(255, 255, 255, 0.1); color: var(--text); box-shadow: inset 0 0 0 1px var(--edge); font-weight: 600; }
.links { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
.link { background: none; border: 0; color: var(--muted); font-size: 0.875rem; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; padding: 0 4px; }
.total { font: 800 3.25rem/1 var(--font-body); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; display: inline-flex; gap: 10px; align-items: center; justify-content: center; }
.total canvas { width: 40px; height: 40px; image-rendering: pixelated; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.chip { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.8125rem; font-weight: 600; background: rgba(255, 255, 255, 0.12); }
.chip.gold { background: var(--star); color: var(--ink); }
.facts { font-size: 0.9375rem; color: var(--muted); line-height: 1.5; }
.facts b { color: var(--text); font-weight: 600; }
.note { display: grid; gap: 10px; padding: 12px 14px; border-radius: 16px; background: rgba(255, 220, 110, 0.1); border: 1px solid rgba(255, 220, 110, 0.3); text-align: left; }
.note .opts { display: flex; gap: 8px; flex-wrap: wrap; }
.note .opts button { min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--edge); background: rgba(255, 255, 255, 0.08); font-weight: 600; font-size: 0.875rem; }
.note .opts button[aria-pressed="true"] { background: var(--star); color: var(--ink); border-color: var(--star); }
textarea, .log {
  width: 100%; box-sizing: border-box; border-radius: 12px; border: 1px solid var(--edge); background: rgba(5, 12, 28, 0.35);
  color: var(--text); font: 0.9375rem/1.4 var(--font-body); padding: 10px 12px; resize: vertical; text-align: left;
}
.log { font-size: 0.75rem; max-height: 40vh; overflow: auto; white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
.tiny { font-size: 0.75rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { #score.bump { animation: none; } }
</style>

<canvas id="c" aria-label="Starlight. Tap a star to send Twinkle there. Keep climbing above the rising sea."></canvas>

<div id="hud" hidden>
  <button class="iconbtn" id="pauseBtn" aria-label="Pause"><span class="pausebars"></span></button>
  <div class="score"><span id="score"><canvas width="7" height="7"></canvas><span id="scoreN">0</span></span><span id="best"></span></div>
  <span></span>
</div>

<div class="overlay" id="start">
  <div class="card">
    <canvas class="hero" id="hero" width="24" height="24"></canvas>
    <h1>Starlight</h1>
    <p class="lead">Tap stars to climb. Don't let the sea catch Twinkle.</p>
    <button class="btn" id="playBtn">Play</button>
    <p id="startBest" class="tiny"></p>
    <div class="links">
      <button class="link" id="soundBtn"></button>
      <button class="link" id="notesBtn">Your runs</button>
    </div>
  </div>
</div>

<div class="overlay" id="pause" hidden>
  <div class="card">
    <h2>Paused</h2>
    <button class="btn" id="resumeBtn">Keep playing</button>
    <button class="btn ghost" id="restartBtn">Start again</button>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card" id="endCard"></div>
</div>

<div class="overlay" id="notes" hidden>
  <div class="card">
    <h2>Your runs</h2>
    <p>Kept only in this browser, for tuning. Copy them into the chat if you want me to look.</p>
    <div class="log" id="logBox"></div>
    <button class="btn" id="copyBtn">Copy</button>
    <button class="btn ghost" id="closeNotes">Close</button>
    <p class="tiny" id="copyMsg" aria-live="polite"></p>
  </div>
</div>

<script>/* Starlight (prototype, 2026-11-12): one move, built deep. Tap a star and Twinkle zips there and lights it. The sea rises,
   slowly, then faster. Light a whole shape to push the sea back. Higher up, some stars twinkle: catch them while they glow.
   Twinkle, the stars and the clouds are drawn by the app's own code (window.Skylings, bundled by build.mjs). */
(() => {
  "use strict";
  const SK = window.Skylings;
  const TWINKLE = SK.COMPANIONS.find((c) => c.key === "star");
  const $ = (id) => document.getElementById(id);
  const Q = new URLSearchParams(location.search);
  const BOT = Q.has("bot");
  const DEBUG = Q.has("debug");
  const RM = !!window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const SPEED = clamp(Number(Q.get("speed")) || 1, 1, 20);
  const fmt = (n) => Math.round(n).toLocaleString("en-US");
  const TAU = Math.PI * 2;

  // ---------- tuning ----------
  const FIELD = 560; // the playfield's width (world units)
  const REACH = 280; // how far Twinkle can zip, from the star it stands on
  const ZIP = 1900; // zip speed
  const STAND = 34; // Twinkle's middle above the star it stands on
  const GRAV = 950;
  const U = 3.4; // world units per skyling pixel
  const STAR = 46; // a star's size
  const TAP = 64; // how close (screen px) a tap must land to a star
  const seaBase = (t) => Math.min(460, 16 + 1.6 * t); // the sea's rise per second: slow, then faster
  const SEA_LEASH = 440; // the sea never trails further than this below you
  const SEA_CALM = 170; // how far a finished shape pushes the sea back
  const TWINKLE_FROM = 2200; // height where twinkling stars begin

  // ---------- this browser only ----------
  const store = {
    get(k, d) {
      try {
        const v = localStorage.getItem("starlight." + k);
        return v == null ? d : JSON.parse(v);
      } catch {
        return d;
      }
    },
    set(k, v) {
      try {
        localStorage.setItem("starlight." + k, JSON.stringify(v));
      } catch {}
    },
  };
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ---------- pictures ----------
  const cache = new Map();
  function sprite(pose, frame) {
    const n = SK.FRAMES[pose].length;
    const f = ((frame % n) + n) % n;
    const id = `tw|${pose}|${f}`;
    let cv = cache.get(id);
    if (cv) return cv;
    cv = document.createElement("canvas");
    cv.width = cv.height = 24;
    const g = cv.getContext("2d");
    const px = SK.pixels(TWINKLE, pose, f, true).filter(([, y]) => y < 23);
    // a pale moonlit rim keeps Twinkle visible on the night sky (as the app draws it)
    const filled = new Set(px.map(([x, y]) => x + "," + y));
    g.fillStyle = "#86a8de";
    for (const k of filled) {
      const [x, y] = k.split(",").map(Number);
      for (const [dx, dy] of [
        [1, 0],
        [-1, 0],
        [0, 1],
        [0, -1],
      ])
        if (!filled.has(x + dx + "," + (y + dy))) g.fillRect(x + dx, y + dy, 1, 1);
    }
    for (const [x, y, col] of px) {
      g.fillStyle = col;
      g.fillRect(x, y, 1, 1);
    }
    cache.set(id, cv);
    return cv;
  }
  function art(id, rows, pal) {
    let cv = cache.get(id);
    if (cv) return cv;
    cv = document.createElement("canvas");
    cv.width = Math.max(...rows.map((r) => r.length));
    cv.height = rows.length;
    const g = cv.getContext("2d");
    rows.forEach((row, y) =>
      [...row].forEach((ch, x) => {
        const col = pal[ch] ?? SK.PAL[ch];
        if (ch !== "." && col) {
          g.fillStyle = col;
          g.fillRect(x, y, 1, 1);
        }
      }),
    );
    cache.set(id, cv);
    return cv;
  }
  const STAR_PAL = {
    dim: { k: "#4d5f80", y: "#e3ebf7" },
    near: { k: "#3b4a6a", y: "#fff8e2" },
    lit: { k: "#5a3d10", y: "#ffdc6e" },
    dark: { k: "#27324d", y: "#3d4d70" },
    out: { k: "#2b3550", y: "#56627a" },
    glow: { k: "#3b4a8a", y: "#d8e6ff" },
  };
  const starArt = (st) => art("star" + st, SK.STAR_ICON, STAR_PAL[st]);
  const cloudArt = (w) => art("cloud" + w, SK.cloud(w), { X: "#3a5486", S: "#2c4372" });
  function glowArt(col) {
    const id = "glow" + col;
    let cv = cache.get(id);
    if (cv) return cv;
    cv = document.createElement("canvas");
    cv.width = cv.height = 64;
    const g = cv.getContext("2d");
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, col);
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    cache.set(id, cv);
    return cv;
  }

  // ---------- sound, made in code ----------
  const Sound = (() => {
    let ac = null;
    let out = null;
    let noiseBuf = null;
    let on = store.get("sound", true);
    function unlock() {
      if (!on) return;
      try {
        if (!ac) {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          out = ac.createGain();
          out.gain.value = 0.55;
          const comp = ac.createDynamicsCompressor();
          out.connect(comp);
          comp.connect(ac.destination);
          noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        if (ac.state === "suspended") ac.resume();
      } catch {
        ac = null;
      }
    }
    function tone(freq, dur, o = {}) {
      if (!ac || !on) return;
      const t0 = ac.currentTime + (o.at || 0);
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, freq * o.slide), t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.15, t0 + (o.attack || 0.006));
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g);
      g.connect(out);
      osc.start(t0);
      osc.stop(t0 + dur + 0.05);
    }
    function noise(dur, o = {}) {
      if (!ac || !on) return;
      const t0 = ac.currentTime + (o.at || 0);
      const src = ac.createBufferSource();
      src.buffer = noiseBuf;
      const f = ac.createBiquadFilter();
      f.type = o.type || "bandpass";
      f.frequency.setValueAtTime(o.freq || 1000, t0);
      if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.freq * o.sweep, t0 + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.15, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f);
      f.connect(g);
      g.connect(out);
      src.start(t0);
      src.stop(t0 + dur + 0.05);
    }
    const PENT = [0, 2, 4, 7, 9];
    const note = (i) => 392 * 2 ** ((12 * Math.floor(i / 5) + PENT[((i % 5) + 5) % 5]) / 12);
    return {
      unlock,
      get on() {
        return on;
      },
      toggle() {
        on = !on;
        store.set("sound", on);
        if (on) unlock();
      },
      zip: () => noise(0.12, { vol: 0.07, freq: 1800, sweep: 2 }),
      star: (i) => {
        tone(note(i), 0.5, { vol: 0.18 });
        tone(note(i) * 2, 0.2, { vol: 0.04 });
      },
      relight: () => tone(330, 0.08, { type: "triangle", vol: 0.06 }),
      no: () => tone(196, 0.12, { type: "triangle", vol: 0.08, slide: 0.8 }),
      shape: (notes) => {
        notes.forEach((n, i) => tone(note(n), 0.45, { vol: 0.12, at: i * 0.07 }));
        noise(0.6, { vol: 0.06, freq: 500, type: "lowpass", at: 0.1 });
      },
      catch: () => {
        tone(note(10), 0.15, { type: "triangle", vol: 0.1 });
        tone(note(12), 0.3, { type: "triangle", vol: 0.1, at: 0.06 });
      },
      warn: () => tone(110, 0.25, { vol: 0.08, slide: 0.9 }),
      splash: () => noise(0.7, { vol: 0.25, freq: 900, type: "lowpass", sweep: 0.3 }),
      best: () => [0, 2, 4, 7, 9, 12].forEach((s, i) => tone(note(5 + i), 0.35, { type: "triangle", vol: 0.1, at: i * 0.07 })),
    };
  })();
  const buzz = (ms) => {

  // ---------- a run ----------
  let state = "menu"; // menu | play | pause | over | end
  let G = null;
  let runs = store.get("runs", []);
  const found = new Set(store.get("found", []));
  const seen = new Set(store.get("hints", []));

  function newRun() {
    const seed = (Math.random() * 2 ** 31) | 0;
    G = {
      R: rng(seed),
      started: false,
      clock: 0,
      vt: 0,
      S: 0,
      seaDrop: 0,
      tw: { x: FIELD / 2, y: -200 - STAND, vy: 0, on: null, zip: null, fromX: 0, fromY: 0 },
      stars: [],
      shapes: [],
      genY: -200,
      prevRow: [],
      nextShapeAt: 620,
      lastShape: -1,
      score: 0,
      best: store.get("best", 0),
      passedBest: false,
      top: 200,
      noteI: 0,
      noteT: -9,
      queued: null,
      squash: 0,
      flashReach: 0,
      fx: [],
      texts: [],
      calls: [],
      ripples: [],
      trail: [],
      hints: [],
      warnT: 0,
      shootT: 6,
      shoot: null,
      cx: (FIELD - VW) / 2,
      cy: 80 - VH,
      stats: { taps: 0, far: 0, dark: 0, relit: 0, lit: 0, shapes: 0, broken: 0, catches: 0, falls: 0, stuck: 0 },
      perf: { frames: 0, sum: 0, worst: 0, slow: 0 },
      newFound: [],
      botT: 0.6,
      stuckT: 0,
    };
    const first = addStar(FIELD / 2, -200, {});
    first.lit = true;
    G.tw.on = first;
    G.prevRow = [first];
    gen(G.cy - 400);
  }

  function addStar(x, y, o) {
    const s = { x, y, lit: false, out: false, shape: null, twinkle: false, ph: G.R(), shake: 0, litT: -9, ...o };
    G.stars.push(s);
    return s;
  }
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  // every star in the row below must reach at least one new star: nobody is ever stuck with no way up
  function cover(prev, fresh) {
    const R = G.R;
    for (const p of prev) {
      if (fresh.some((s) => dist(s, p) < REACH * 0.84)) continue;
      const top = Math.min(...fresh.map((s) => s.y));
      const dy = Math.max(60, p.y - top);
      const span = Math.sqrt(Math.max(0, (REACH * 0.8) ** 2 - dy * dy));
      fresh.push(addStar(clamp(p.x + (R() - 0.5) * 2 * span * 0.8, 50, FIELD - 50), p.y - dy, {}));
    }
    return fresh;
  }
  function gen(upTo) {
    while (G.genY > upTo) {
      const h = -G.genY;
      if (h > G.nextShapeAt) placeShape();
      else addRow(h);
    }
  }
  function addRow(h) {
    const R = G.R;
    const hard = clamp((h - 400) / 7000, 0, 1);
    G.genY -= lerp(100, 155, hard) * (0.85 + R() * 0.3);
    const n = h < 1500 ? 2 + (R() < 0.35 ? 1 : 0) : 1 + (R() < 0.75 - hard * 0.35 ? 1 : 0);
    const xs = [];
    for (let i = 0; i < n; i++) {
      let x = 0;
      for (let k = 0; k < 12; k++) {
        x = 50 + R() * (FIELD - 100);
        if (xs.every((o) => Math.abs(o - x) > 130)) break;
      }
      xs.push(x);
    }
    const tw = h > TWINKLE_FROM ? lerp(0.25, 0.5, hard) : 0;
    const row = xs.map((x) => addStar(x, G.genY + (R() - 0.5) * 30, { twinkle: R() < tw }));
    cover(G.prevRow, row);
    if (h < 4500 && row.every((s) => s.twinkle)) row[0].twinkle = false;
    G.prevRow = row;
  }
  function placeShape() {
    const R = G.R;
    let si = (R() * SHAPES.length) | 0;
    if (si === G.lastShape) si = (si + 1) % SHAPES.length;
    G.lastShape = si;
    const sh = SHAPES[si];
    const w = 220 + R() * 80;
    const hh = 180 + R() * 70;
    const left = R() < 0.5;
    const x0 = left ? 50 + R() * 30 : FIELD - 50 - w - R() * 30;
    const bottom = G.genY - 125;
    const top = bottom - hh;
    const order = sh.pts.map((p, k) => [p[0] + p[1] * 0.01, k]).sort((a, b) => a[0] - b[0]);
    const con = { name: sh.name, stars: [], edges: sh.edges, done: false, broken: false };
    sh.pts.forEach(([px, py], k) => {
      const s = addStar(x0 + px * w, top + py * hh, { shape: con, note: order.findIndex((o) => o[1] === k) });
      con.stars.push(s);
    });
    G.shapes.push(con);
    // a way past it on the other side, for when climbing matters more
    const bx0 = left ? x0 + w + 70 : 50;
    const bx1 = left ? FIELD - 50 : x0 - 70;
    const bypass = [];
    if (bx1 - bx0 > 20) for (let yy = bottom - 10; yy > top - 20; yy -= 125) bypass.push(addStar(bx0 + R() * (bx1 - bx0), yy, {}));
    cover(G.prevRow, [...con.stars, ...bypass]);
    G.genY = top;
    G.prevRow = [...con.stars.filter((s) => s.y < top + hh * 0.4), ...bypass.slice(-1)];
    G.nextShapeAt = -G.genY + 600 + R() * 450;
  }

  const glowing = (s) => !s.twinkle || (((G.clock * 0.62 + s.ph) % 1) + 1) % 1 < 0.58;
  const fading = (s) => s.twinkle && (((G.clock * 0.62 + s.ph) % 1) + 1) % 1 > 0.46 && glowing(s);
  const feet = () => ({ x: G.tw.x, y: G.tw.y + STAND });

  // ---------- the move ----------
  function tapAt(sx, sy) {
    if (state !== "play") return;
    Sound.unlock();
    const wx = G.cx + sx / SC;
    const wy = G.cy + sy / SC;
    const f = feet();
    // the star under the finger; a near miss picks the reachable one
    let pick = null;
    let pd = Infinity;
    for (const s of G.stars) {
      if (s.out || s === G.tw.on) continue;
      const d = Math.hypot(s.x - wx, s.y - wy) * SC;
      if (d > TAP) continue;
      const ok = dist(s, f) <= REACH ? 0 : 1000;
      if (d + ok < pd) {
        pd = d + ok;
        pick = s;
      }
    }
    G.stats.taps++;
    if (!pick) {
      G.ripples.push({ x: wx, y: wy, life: 0.35 });
      return;
    }
    if (G.tw.zip) {
      G.queued = pick;
      return;
    }
    go(pick);
  }
  function go(s) {
    const f = feet();
    if (dist(s, f) > REACH) {
      s.shake = 0.35;
      G.flashReach = 0.5;
      G.stats.far++;
      Sound.no();
      return;
    }
    if (!glowing(s)) {
      s.shake = 0.35;
      G.stats.dark++;
      Sound.no();
      return;
    }
    const tw = G.tw;
    tw.fromX = tw.x;
    tw.fromY = tw.y;
    tw.zip = s;
    tw.falling = !tw.on;
    tw.on = null;
    Sound.zip();
    if (!G.started) G.started = true;
  }
  function arrive(s) {
    const tw = G.tw;
    tw.x = s.x;
    tw.y = s.y - STAND;
    tw.vy = 0;
    tw.on = s;
    tw.zip = null;
    G.squash = 1;
    burst(s.x, s.y, s.lit ? "#cfe0ff" : "#ffdc6e", s.lit ? 4 : 12, s.lit ? 120 : 240, 5);
    if (tw.falling) {
      G.stats.catches++;
      text(s.x, s.y - 70, "Caught it!", "#cfe0ff", 26);
      Sound.catch();
    }
    if (!s.lit) light(s);
    else {
      G.stats.relit++;
      Sound.relight();
    }
    G.top = Math.max(G.top, -s.y);
    if (G.queued) {
      const q = G.queued;
      G.queued = null;
      if (!q.out && q !== s) go(q);
    }
  }
  function light(s) {
    s.lit = true;
    s.litT = G.clock;
    G.stats.lit++;
    G.score += 1;
    bumpScore();
    // quick taps climb the scale, a pause starts it again
    G.noteI = G.clock - G.noteT < 1.3 ? Math.min(G.noteI + 1, 12) : 0;
    G.noteT = G.clock;
    Sound.star(s.shape ? s.note + 2 : G.noteI);
    buzz(6);
    const c = s.shape;
    if (c && !c.done && !c.broken && c.stars.every((x) => x.lit)) {
      c.done = true;
      G.stats.shapes++;
      const n = c.stars.length;
      G.score += n;
      bumpScore();
      G.seaDrop += SEA_CALM;
      if (!found.has(c.name)) {
        found.add(c.name);
        G.newFound.push(c.name);
        store.set("found", [...found]);
      }
      call(c.name, `+${n} stars · the sea calms`, "#ffdc6e");
      Sound.shape(c.stars.map((x) => x.note + 2).sort((a, b) => a - b));
      for (const x of c.stars) burst(x.x, x.y, "#fff3c4", 10, 220, 6);
      buzz(18);
    }
    if (!G.passedBest && G.best > 0 && G.score > G.best) {
      G.passedBest = true;
      call("New best!", "Keep going", "#86d3a0");
      Sound.best();
    }
  }

  // ---------- one step ----------
  function step(dt) {
    const tw = G.tw;
    if (G.started) G.clock += dt;
    // the sea rises; it never trails too far behind you
    if (G.started) {
      const gap = G.S - feet().y;
      G.S -= (seaBase(G.clock) + Math.max(0, gap - SEA_LEASH) * 1.6) * dt;
      if (G.seaDrop > 0) {
        const k = Math.min(G.seaDrop, 340 * dt);
        G.S = Math.min(G.S + k, feet().y + SEA_LEASH);
        G.seaDrop -= k;
      }
    }
    // Twinkle
    if (tw.zip) {
      const s = tw.zip;
      const tx = s.x;
      const ty = s.y - STAND;
      const d = Math.hypot(tx - tw.x, ty - tw.y);
      const stepLen = ZIP * dt;
      G.trail.push({ x: tw.x, y: tw.y, life: 0.25 });
      if (d <= stepLen) arrive(s);
      else {
        tw.x += ((tx - tw.x) / d) * stepLen;
        tw.y += ((ty - tw.y) / d) * stepLen;
      }
    } else if (tw.on) {
      // a twinkling star that goes dark drops you
      if (!glowing(tw.on) && tw.on.twinkle) {
        tw.on = null;
        tw.vy = 60;
        G.stats.falls++;
      }
    } else {
      tw.vy = Math.min(tw.vy + GRAV * dt, 900);
      tw.y += tw.vy * dt;
    }
    // stars the sea reaches go out
    for (const s of G.stars) {
      if (!s.out && s.y > G.S - 8) {
        s.out = true;
        if (s.shape && !s.shape.done && !s.shape.broken) {
          s.shape.broken = true;
          G.stats.broken++;
        }
        if (s.y < G.cy + VH + 40) burst(s.x, G.S, "#9fb4d8", 4, 80, 4);
      }
    }
    // caught
    if (tw.y + STAND * 0.6 > G.S && !tw.zip) return over();
    // hints, once per device
    hint("tap", true);
    if (G.started) {
      const vis = (s) => s.y > G.cy + 120 / SC && s.y < G.cy + VH - 60;
      const sh = G.shapes.find((c) => !c.done && !c.broken && c.stars.every(vis));
      if (sh) hint("shape", sh);
      const tws = G.stars.find((s) => s.twinkle && !s.out && vis(s));
      if (tws) hint("glow", tws);
      if (G.S - feet().y < 230) hint("sea", true);
    }
    // danger hum
    G.warnT -= dt;
    if (G.started && G.S - feet().y < 170 && G.warnT <= 0) {
      Sound.warn();
      G.warnT = 0.9;
    }
    // stuck check (for the bot's fairness report): standing with no way up
    if (BOT && tw.on && !tw.zip) {
      const f = feet();
      const up = G.stars.some((s) => !s.out && s !== tw.on && s.y < f.y - 20 && dist(s, f) <= REACH);

    card.append(facts, el("p", "tiny", `Shapes found: ${found.size} of ${SHAPES.length}`));
    if (runs.length === 3 || runs.length === 8) card.append(noteBox(rec));
    const again = el("button", "btn", "Play again");
    again.id = "againBtn";
    again.onclick = play;
    card.append(again);
    const links = el("div", "links");
    const home = el("button", "link", "Home");
    home.onclick = goHome;
    const note = el("button", "link", "Leave a note");
    note.onclick = () => {
      if (!card.querySelector(".note")) card.insertBefore(noteBox(rec), again);
    };
    links.append(home, note);
    card.append(links);
  }
  function noteBox(rec) {
    const box = el("div", "note");
    box.append(el("b", null, "Did you want another go right away?"));
    const opts = el("div", "opts");
    const area = document.createElement("textarea");
    area.id = "note" + rec.id;
    area.rows = 2;
    area.placeholder = "What made you feel that? (optional)";
    const saved = el("span", "tiny");
    const save = () => {
      const r = runs.find((x) => x.id === rec.id);
      if (!r) return;
      r.wantedAnother = box.dataset.answer || null;
      r.note = area.value.trim().slice(0, 400) || null;
      store.set("runs", runs);
      saved.textContent = "Saved in this browser.";
    };
    for (const a of ["Yes, right away", "A little", "Not really"]) {
      const b = el("button", null, a);
      b.setAttribute("aria-pressed", "false");
      b.onclick = () => {
        box.dataset.answer = a;
        opts.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        save();
      };
      opts.append(b);
    }
    area.addEventListener("change", save);
    area.addEventListener("blur", save);
    box.append(opts, area, saved);
    return box;
  }

  // ---------- screens ----------
  function play() {
    Sound.unlock();
    newRun();
    state = "play";
    $("start").hidden = true;
    $("end").hidden = true;
    $("pause").hidden = true;
    $("notes").hidden = true;
    $("hud").hidden = false;
    $("scoreN").textContent = "0";
    $("best").textContent = G.best ? `Best ${fmt(G.best)}` : "";
  }
  function pause() {
    state = "pause";
    $("pause").hidden = false;
    $("resumeBtn").focus({ preventScroll: true });
  }
  function goHome() {
    state = "menu";
    G = null;
    $("end").hidden = true;
    $("hud").hidden = true;
    buildStart();
    $("start").hidden = false;
  }
  function buildStart() {
    $("hero").getContext("2d").clearRect(0, 0, 24, 24);
    $("hero").getContext("2d").drawImage(sprite("wave", 0), 0, 0);
    const best = store.get("best", 0);
    $("startBest").textContent = best ? `Your best: ${fmt(best)} stars · shapes found ${found.size} of ${SHAPES.length}` : "";
    $("soundBtn").textContent = Sound.on ? "Sound on" : "Sound off";
  }
  $("score").querySelector("canvas").getContext("2d").drawImage(starArt("lit"), 0, 0);
  $("playBtn").onclick = play;
  $("pauseBtn").onclick = pause;
  $("resumeBtn").onclick = () => {
    state = "play";
    $("pause").hidden = true;
  };
  $("restartBtn").onclick = play;
  $("soundBtn").onclick = () => {
    Sound.toggle();
    $("soundBtn").textContent = Sound.on ? "Sound on" : "Sound off";
  };
  const logText = () =>
    [
      `Starlight runs (${runs.length}), newest last. Shapes found ${found.size}/${SHAPES.length}.`,
      ...runs.map(
        (r) =>
          `${r.at} stars ${r.score}${r.best ? " (best)" : ""} ${r.seconds}s climbed ${r.climbed}m shapes ${r.shapes} broken ${r.broken} taps ${r.taps} too-far ${r.far} dark ${r.dark} catches ${r.catches} drops ${r.falls} fps ${r.fps} worst ${r.worstFrameMs}ms${r.wantedAnother ? ` | another go: ${r.wantedAnother}` : ""}${r.note ? ` | "${r.note}"` : ""}`,
      ),
    ].join("\n");
  $("notesBtn").onclick = () => {
    $("logBox").textContent = runs.length ? logText() : "No runs yet.";
    $("copyMsg").textContent = "";
    $("notes").hidden = false;
  };
  $("closeNotes").onclick = () => ($("notes").hidden = true);
  $("copyBtn").onclick = async () => {
    try {
      await navigator.clipboard.writeText(logText());
      $("copyMsg").textContent = "Copied.";
    } catch {
      const r = document.createRange();
      r.selectNodeContents($("logBox"));
      const s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      $("copyMsg").textContent = "Selected. Copy it with your device's copy.";
    }
  };

  // ---------- the loop ----------
  const STEP = 1 / 120;
  let acc = 0;
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const raw = (now - last) / 1000;
    last = now;
    const dt = Math.min(0.05, raw);
    if (G) G.vt += dt;
    if (state === "play") {
      if (G.started && raw < 1) {
        G.perf.frames++;
        G.perf.sum += raw;
        G.perf.worst = Math.max(G.perf.worst, raw * 1000);
        if (raw > 1 / 40) G.perf.slow++;
      }
      acc += dt * SPEED;
      while (acc >= STEP && state === "play") {
        acc -= STEP;
        if (BOT) bot();
        step(STEP);
      }
    } else acc = 0;
    if (G && (state === "play" || state === "over")) {
      const f = feet();
      // the view rides with the sea, so it's always there at the bottom; Twinkle climbs away from it or sinks toward it
      let want = G.S + 80 - VH;
      if (G.tw.y - want < VH * 0.3) want = G.tw.y - VH * 0.3;
      G.cy = lerp(G.cy, want, Math.min(1, dt * 4));
      G.cx = (FIELD - VW) / 2;
      for (const p of G.fx) {
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 300 * dt;
      }
      G.fx = G.fx.filter((p) => p.life > 0);
      for (const t of G.texts) {
        t.life -= dt;
        t.y -= 40 * dt;
      }
      G.texts = G.texts.filter((t) => t.life > 0);
      for (const c of G.calls) c.life -= dt;
      G.calls = G.calls.filter((c) => c.life > 0);
      void f;
    }
    if (state === "over") {
      G.overT += dt;
      G.tw.y += 120 * dt;
      if (G.overT > (BOT ? 0.1 : 0.9)) finish();
    }
    render(dt);
  }
  window.__sl = {
    get state() {
      return state;
    },
    get G() {
      return G;
    },
    play,
    last: null,
  };
  buildStart();
  requestAnimationFrame(frame);
})();
</script>
