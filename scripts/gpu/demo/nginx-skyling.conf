# The one door to the demo app: a password in front of everything (nginx basic auth), then the app on the same box.
# The app itself listens only on 127.0.0.1, so nothing reaches it without this password.
server {
  listen 127.0.0.1:8080;
  auth_basic "Skyling 1.0";
  auth_basic_user_file /etc/nginx/skyling.htpasswd;
  client_max_body_size 20m;
  # the test frame: label, minutes and credits, the Stop button (scripts/gpu/demo/control.py)
  location /__skyling {
    proxy_pass http://127.0.0.1:8200;
    proxy_set_header Authorization "";
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    # The app refuses to be shown inside another page. The test frame is this same address, so here, and only on this
    # throwaway box, it may be shown inside a page from itself (still not inside anyone else's).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    proxy_http_version 1.1;
    # the app checks that a form comes from its own address, so it must see the address the person typed
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $skyling_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # the link's password stops here; the app has its own sign-in
    proxy_set_header Authorization "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    # answers stream; do not hold them back
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
# behind the tunnel the person is on https even though this hop is plain http
map $http_x_forwarded_proto $skyling_proto {
  default $http_x_forwarded_proto;
  ""      http;
}
