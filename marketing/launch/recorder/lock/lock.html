<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      @font-face {
        font-family: Geist;
        src: url(Geist.woff2) format("woff2");
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 390px;
        height: 844px;
        overflow: hidden;
      }
      body {
        font-family: Geist, system-ui, sans-serif;
        color: #fff;
        background: #10261d;
        position: relative;
      }
      .wall {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 70% at 20% 10%, #3f8a69 0%, transparent 60%), radial-gradient(90% 60% at 90% 80%, #2b6a51 0%, transparent 65%),
          linear-gradient(170deg, #1d4535 0%, #0f2a20 55%, #0a1d16 100%);
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(2px);
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55), rgba(160, 215, 190, 0.25) 35%, rgba(40, 100, 75, 0.15) 70%, transparent 72%);
      }
      .top {
        position: absolute;
        top: 92px;
        width: 100%;
        text-align: center;
      }
      .date {
        font-size: 19px;
        font-weight: 500;
        opacity: 0.92;
        letter-spacing: 0.2px;
      }
      .time {
        font-size: 92px;
        font-weight: 600;
        letter-spacing: -2px;
        line-height: 1;
        margin-top: 4px;
      }
      .lockic {
        position: absolute;
        top: 56px;
        left: 50%;
        transform: translateX(-50%);
        width: 14px;
        height: 18px;
      }
      .list {
        position: absolute;
        left: 10px;
        right: 10px;
        top: 300px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .n {
        background: rgba(245, 248, 246, 0.8);
        backdrop-filter: blur(24px) saturate(1.4);
        -webkit-backdrop-filter: blur(24px);
        color: #0e1a14;
        border-radius: 22px;
        padding: 12px 14px 13px;
        display: grid;
        grid-template-columns: 38px 1fr;
        gap: 10px;
        opacity: 0;
        transform: translateY(-26px) scale(0.94);
        transition:
          transform 0.55s cubic-bezier(0.2, 1.3, 0.4, 1),
          opacity 0.35s ease;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
      }
      .n.in {
        opacity: 1;
        transform: none;
      }
      .n.press {
        transform: scale(0.965);
        transition: transform 0.18s ease;
      }
      .n img {
        width: 38px;
        height: 38px;
        border-radius: 9px;
      }
      .h {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .t {
        font-weight: 650;
        font-size: 15px;
        line-height: 1.25;
      }
      .when {
        font-size: 13px;
        color: rgba(20, 30, 25, 0.55);
        white-space: nowrap;
        margin-left: 8px;
      }
      .b {
        font-size: 15px;
        line-height: 1.3;
        margin-top: 2px;
        color: #18241e;
      }
      .bottom {
        position: absolute;
        bottom: 34px;
        left: 50%;
        transform: translateX(-50%);
        width: 134px;
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.85);
      }
      .cam,
      .torch {
        position: absolute;
        bottom: 52px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(12px);
        display: grid;
        place-items: center;
      }
      .cam {
        right: 46px;
      }
      .torch {
        left: 46px;
      }
    </style>
  </head>
  <body>
    <div class="wall"></div>
    <div class="orb" style="width: 220px; height: 220px; left: -60px; top: 520px; opacity: 0.55"></div>
    <div class="orb" style="width: 140px; height: 140px; right: -30px; top: 200px; opacity: 0.45"></div>
    <div class="orb" style="width: 90px; height: 90px; left: 250px; top: 640px; opacity: 0.5"></div>
    <svg class="lockic" viewBox="0 0 14 18">
      <rect x="1" y="7" width="12" height="10" rx="2.2" fill="#fff" />
      <path d="M3.8 7V5a3.2 3.2 0 0 1 6.4 0v2" fill="none" stroke="#fff" stroke-width="1.8" />
    </svg>
    <div class="top">
      <div class="date">Monday, November 9</div>
      <div class="time">8:22</div>
    </div>
    <div class="list" id="list"></div>
    <div class="torch">
      <svg width="18" height="22" viewBox="0 0 18 22"><path d="M5 1h8l-1 6H6z M6 8h6v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z" fill="#fff" /></svg>
    </div>
    <div class="cam">
      <svg width="22" height="18" viewBox="0 0 22 18">
        <path d="M3 4h4l2-3h4l2 3h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#fff" />
        <circle cx="11" cy="10" r="3.6" fill="#333" />
      </svg>
    </div>
    <div class="bottom"></div>
    <script>
      const N = JSON.parse(decodeURIComponent(location.hash.slice(1)));
      const list = document.getElementById("list");
      N.forEach((m, i) => {
        const d = document.createElement("div");
        d.className = "n";
        d.id = "n" + i;
        d.innerHTML = `<img src="appicon.png" alt=""><div><div class="h"><span class="t"></span><span class="when">now</span></div><div class="b"></div></div>`;
        d.querySelector(".t").textContent = m.title;
        d.querySelector(".b").textContent = m.body;
        list.appendChild(d);
      });
      window.showN = (i) => document.getElementById("n" + i).classList.add("in");
      window.pressN = (i) => document.getElementById("n" + i).classList.add("press");
    </script>
  </body>
</html>
