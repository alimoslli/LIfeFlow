<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: Geist;
        src: url(Geist.woff2) format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: Serif;
        src: url(Newsreader.woff2) format("woff2");
        font-weight: 200 800;
      }
      @font-face {
        font-family: SerifI;
        src: url(Newsreader-Italic.woff2) format("woff2");
        font-weight: 200 800;
        font-style: italic;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --ink: #121714;
        --moss: #285b45;
        --green: #2f6b52;
        --mint: #8fd0b5;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: Geist, sans-serif;
        background: #f3f2ec;
      }
      .abs {
        position: absolute;
      }
      #bg {
        inset: 0;
        background:
          radial-gradient(55% 35% at 12% 88%, rgba(143, 208, 181, 0.5), transparent 70%),
          radial-gradient(50% 30% at 92% 8%, rgba(246, 228, 196, 0.85), transparent 70%), linear-gradient(180deg, #fbfaf6, #ecefe8);
      }
      .blob {
        border-radius: 50%;
        filter: blur(70px);
      }
      .cap {
        left: 40px;
        width: 1000px;
        top: 96px;
        text-align: center;
        font-weight: 820;
        font-size: 104px;
        line-height: 1.02;
        letter-spacing: -1px;
        color: var(--ink);
      }
      .cap .w {
        display: inline-block;
        overflow: hidden;
        vertical-align: top;
        padding: 0 0.07em;
      }
      .cap .w span {
        display: inline-block;
      }
      .cap .hl {
        color: var(--moss);
      }
      #cam {
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 540px 1100px;
      }
      #phone {
        left: 163px;
        top: 392px;
        width: 754px;
        border-radius: 104px;
        background: #151816;
        padding: 16px;
        box-shadow:
          0 70px 140px rgba(20, 40, 30, 0.3),
          inset 0 0 0 3px #3c413e;
      }
      #screen {
        position: relative;
        width: 722px;
        height: 1561px;
        border-radius: 88px;
        overflow: hidden;
        background: #f4f1ea;
      }
      #scr {
        position: absolute;
        left: 0;
        width: 722px;
        height: 1561px;
        display: block;
      }
      #sbar {
        left: 0;
        top: 0;
        width: 722px;
        height: 82px;
        z-index: 4;
        font-weight: 650;
        font-size: 31px;
      }
      #sbar .tm {
        position: absolute;
        left: 70px;
        top: 26px;
      }
      #sbar .ic {
        position: absolute;
        right: 56px;
        top: 30px;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .cap .ln {
        white-space: nowrap;
      }
      #island {
        left: 50%;
        top: 26px;
        width: 200px;
        height: 56px;
        margin-left: -100px;
        background: #000;
        border-radius: 28px;
        z-index: 5;
      }
      #ov {
        left: 0;
        top: 0;
        width: 722px;
        height: 1561px;
        pointer-events: none;
      }
      .mk {
        background: rgba(143, 208, 181, 0.62);
        border-radius: 8px;
        transform-origin: left center;
        mix-blend-mode: multiply;
      }
      .ring {
        border-radius: 28px;
        box-shadow:
          0 0 0 5px rgba(47, 107, 82, 0.55),
          0 0 40px 10px rgba(143, 208, 181, 0.55);
      }
      .finger {
        width: 84px;
        height: 84px;
        margin: -42px 0 0 -42px;
        border-radius: 50%;
        background: rgba(40, 40, 40, 0.28);
        border: 4px solid rgba(255, 255, 255, 0.92);
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      }
      .note {
        left: 70px;
        width: 940px;
        border-radius: 46px;
        overflow: hidden;
        box-shadow:
          0 40px 90px rgba(10, 30, 20, 0.28),
          0 0 0 2px rgba(255, 255, 255, 0.6) inset;
      }
      .note img {
        width: 100%;
        display: block;
      }
      .shine {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 240px;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      }
      #flash {
        inset: 0;
        background: #fff;
        opacity: 0;
      }
      #end {
        inset: 0;
        display: none;
        text-align: center;
      }
      #end img {
        width: 170px;
        height: 170px;
        border-radius: 38px;
        margin-top: 640px;
      }
      #end .w1 {
        font-family: Serif;
        font-size: 112px;
        color: var(--ink);
        margin-top: 24px;
      }
      #end .w2 {
        font-weight: 800;
        font-size: 64px;
        color: var(--moss);
        margin-top: 26px;
        letter-spacing: -0.5px;
      }
      #end .w3 {
        font-weight: 700;
        font-size: 46px;
        color: var(--ink);
        margin-top: 40px;
      }
      #end .w4 {
        font-size: 28px;
        color: #7d877f;
        margin-top: 230px;
      }
    </style>
  </head>
  <body>
    <div id="bg" class="abs"></div>
    <div class="abs blob" id="bl1" style="width: 560px; height: 560px; left: -160px; top: 1280px; background: rgba(143, 208, 181, 0.5)"></div>
    <div class="abs blob" id="bl2" style="width: 440px; height: 440px; left: 760px; top: 160px; background: rgba(246, 226, 190, 0.75)"></div>
    <div id="cam" class="abs">
      <div id="phone" class="abs">
        <div id="screen">
          <img id="scr" />
          <div id="sbar" class="abs">
            <span class="tm" id="tm">8:24</span
            ><span class="ic"
              ><svg width="34" height="20" viewBox="0 0 34 20">
                <rect x="0" y="12" width="5" height="8" rx="1.5" fill="currentColor" />
                <rect x="9" y="8" width="5" height="12" rx="1.5" fill="currentColor" />
                <rect x="18" y="4" width="5" height="16" rx="1.5" fill="currentColor" />
                <rect x="27" y="0" width="5" height="20" rx="1.5" fill="currentColor" /></svg
              ><svg width="50" height="24" viewBox="0 0 50 24">
                <rect x="1" y="1" width="42" height="22" rx="6" fill="none" stroke="currentColor" stroke-width="2" opacity=".5" />
                <rect x="4" y="4" width="32" height="16" rx="3.5" fill="currentColor" />
                <rect x="45" y="8" width="3.5" height="8" rx="1.5" fill="currentColor" opacity=".5" /></svg
            ></span>
          </div>
          <div id="island" class="abs"></div>
          <div id="ov" class="abs"></div>
        </div>
      </div>
    </div>
    <div id="caps"></div>
    <div id="n0" class="abs note">
      <img src="jl_n0.png" />
      <div class="shine" id="sh0"></div>
    </div>
    <div id="flash" class="abs"></div>
    <div id="end" class="abs">
      <img src="mark.png" />
      <div class="w1">LifeFlow</div>
      <div class="w2">Your personal assistant.</div>
      <div class="w3">Tap the link in bio.</div>
      <div class="w4">Real app and real replies, on a sample account.</div>
    </div>
    <script>
      const D = window.DATA; // filled by the renderer: { frames:[[file,t]], taps:[t,x,y], segs:[...], caps:[...], marks:[...], rings:[...], lock:{n, fps, from} , total, endAt }
      const $ = (id) => document.getElementById(id);
      const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
      const P = (t, a, d) => clamp((t - a) / d);
      const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
      const io = (x) => {
        x = clamp(x);
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      };
      const back = (x, s = 1.7) => {
        x = clamp(x);
        return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
      };
      const K = 722 / 390;
      // captions
      $("caps").innerHTML = D.caps
        .map(
          (c, i) =>
            `<div class="abs cap" id="cap${i}">${c.lines
              .map(
                (l) =>
                  '<div class="ln">' +
                  l
                    .split(" ")
                    .map((w) => `<span class="w"><span class="${w.startsWith("*") ? "hl" : ""}">${w.replace(/\*/g, "")}</span></span>`)
                    .join(" ") +
                  "</div>",
              )
              .join("")}</div>`,
        )
        .join("");
      D.caps.forEach((c, i) => {
        const el = $("cap" + i);
        el.style.display = "block";
        let w = 0;
        el.querySelectorAll(".ln").forEach((l) => {
          l.style.display = "inline-block";
          w = Math.max(w, l.scrollWidth);
          l.style.display = "block";
        });
        if (w > 990) el.style.fontSize = `${(104 * 990) / w}px`;
        el.style.display = "none";
      });
      // markers, rings, fingers
      $("ov").innerHTML =
        D.marks
          .map(
            (m, i) =>
              `<div class="abs mk" id="mk${i}" style="left:${(m.x - 3) * K}px;top:${(m.y + 1) * K}px;width:${(m.w + 6) * K}px;height:${(m.h - 1) * K}px"></div>`,
          )
          .join("") +
        D.rings
          .map(
            (r, i) =>
              `<div class="abs ring" id="rg${i}" style="left:${(r.x - 6) * K}px;top:${(r.y - 6) * K}px;width:${(r.w + 12) * K}px;height:${(r.h + 12) * K}px"></div>`,
          )
          .join("") +
        D.taps.map((f, i) => `<div class="abs finger" id="fg${i}" style="left:${f.x * K}px;top:${f.y * K}px"></div>`).join("");
      const clipAt = (t) => {
        // edit time -> clip time (piecewise linear), or null outside the chat
        for (const s of D.segs) if (t >= s.ea && t < s.eb) return s.ca + ((t - s.ea) / (s.eb - s.ea)) * (s.cb - s.ca);
        return null;
      };
      const nearest = (ct) => {
        let lo = 0,
          hi = D.frames.length - 1;
        while (lo < hi) {
          const m = (lo + hi + 1) >> 1;
          if (D.frames[m][1] <= ct) lo = m;
          else hi = m - 1;
        }
        return D.frames[lo][0];
      };
      let last = "";
      async function seek(t) {
        $("bl1").style.transform = `translate(${Math.sin(t * 0.5) * 40}px, ${Math.cos(t * 0.4) * 30}px)`;
        $("bl2").style.transform = `translate(${Math.cos(t * 0.45) * 40}px, ${Math.sin(t * 0.35) * 30}px)`;
        const L = D.lock;
        let src;
        if (t < L.until) {
          const f = Math.min(L.n, Math.max(1, Math.round((L.from + t) * L.fps) + 1));
          src = `lockf2/${String(f).padStart(4, "0")}.jpg`;
        } else {
          const ct = clipAt(t);
          src = ct === null ? last : D.dir + "/" + nearest(ct);
        }
        // phone entrance, camera push-ins (cam keys: [t, scale, originX, originY, ty])
        const kIn = out(P(t, 0, 0.8));
        let sc = 1,
          oy = 1100,
          ox = 540,
          ty = 0;
        for (const c of D.cams) {
          const k = io(P(t, c.a, c.d)) * (1 - io(P(t, c.b, 0.45)));
          if (k > 0) {
            sc = 1 + (c.s - 1) * k;
            ox = c.ox;
            oy = c.oy;
            ty = c.ty * k;
          }
        }
        const endK = io(P(t, D.endAt - 0.5, 0.5));
        $("cam").style.transformOrigin = `${ox}px ${oy}px`;
        $("cam").style.transform = `translateY(${(1 - kIn) * 900 + ty - endK * 200}px) scale(${sc * (1 - 0.1 * endK)})`;
        $("cam").style.opacity = String(1 - endK);
        // captions
        D.caps.forEach((c, i) => {
          const el = $("cap" + i);
          const vis = t >= c.a - 0.01 && t < c.b;
          el.style.display = vis ? "block" : "none";
          if (!vis) return;
          const ko = io(P(t, c.b - 0.22, 0.22));
          el.querySelectorAll(".w > span").forEach((w, j) => {
            const k = out(P(t, c.a + j * 0.06, 0.4));
            w.style.transform = `translateY(${(1 - k) * 110 - ko * 70}%)`;
            w.style.opacity = String(clamp(k * 1.4) * (1 - ko));
          });
        });
        // markers / rings / fingers
        D.marks.forEach((m, i) => {
          const k = io(P(t, m.at, 0.35));
          const vis = t >= m.at && t < m.until;
          const el = $("mk" + i);
          el.style.display = vis ? "block" : "none";
          el.style.transform = `scaleX(${k})`;
          el.style.opacity = String(1 - io(P(t, m.until - 0.2, 0.2)));
        });
        D.rings.forEach((r, i) => {
          const el = $("rg" + i);
          const k = out(P(t, r.at, 0.4)) * (1 - io(P(t, r.until - 0.35, 0.35)));
          el.style.display = k > 0.01 ? "block" : "none";
          el.style.opacity = String(k);
          el.style.transform = `scale(${1.04 - 0.04 * k})`;
        });
        D.taps.forEach((f, i) => {
          const el = $("fg" + i);
          const dt = t - f.at;
          let s = 0,
            a = 0;
          if (dt >= -0.15 && dt < 0.45) {
            if (dt < 0) {
              s = 1.3 - (0.3 * (dt + 0.15)) / 0.15;
              a = (dt + 0.15) / 0.15;
            } else if (dt < 0.12) {
              s = 1 - (0.08 * dt) / 0.12;
              a = 1;
            } else {
              const k = (dt - 0.12) / 0.33;
              s = 0.92 + 0.5 * k;
              a = 1 - k;
            }
          }
          el.style.display = a > 0.01 ? "block" : "none";
          el.style.opacity = String(a);
          el.style.transform = `scale(${s})`;
        });
        // lock notification pop + transition into the chat
        const n = $("n0");
        const nv = t >= L.popAt && t < L.until + 0.1;
        n.style.display = nv ? "block" : "none";
        if (nv) {
          const k = back(P(t, L.popAt, 0.55), 1.4);
          const ex = io(P(t, L.until - 0.45, 0.45));
          n.style.top = `${1080 + (1 - out(P(t, L.popAt, 0.55))) * -260}px`;
          n.style.transform = `scale(${(0.6 + 0.4 * k) * (1 + 0.5 * ex)})`;
          n.style.opacity = String(clamp(P(t, L.popAt, 0.12)) * (1 - ex));
          $("sh0").style.left = `${-300 + 1400 * io(P(t, L.popAt + 0.4, 0.8))}px`;
        }
        $("flash").style.opacity = String(Math.max(0, 1 - Math.abs(t - L.until) / 0.16) * 0.85);
        // end card
        const e = $("end");
        e.style.display = t >= D.endAt - 0.2 ? "block" : "none";
        if (t >= D.endAt - 0.2) {
          [...e.children].forEach((c, j) => {
            const k = out(P(t, D.endAt + j * 0.12, 0.5));
            c.style.opacity = String(k);
            c.style.transform = `translateY(${(1 - k) * 40}px)`;
          });
        }
        const inLock = t < L.until;
        const SB = 82;
        $("scr").style.top = inLock ? "0px" : SB + "px";
        $("ov").style.top = inLock ? "0px" : SB + "px";
        $("sbar").style.color = inLock ? "#ffffff" : "#121714";
        $("sbar").style.background = inLock ? "transparent" : "#f3efe6";
        $("sbar").style.display = inLock ? "none" : "block";
        $("tm").textContent = inLock ? "8:22" : "8:24";
        if (src && src !== last) {
          $("scr").src = src;
          last = src;
        }
        const img = $("scr");
        if (!img.complete)
          await new Promise((r) => {
            img.onload = r;
            img.onerror = r;
          });
        await img.decode().catch(() => {});
      }
      window.seek = seek;
    </script>
  </body>
</html>
