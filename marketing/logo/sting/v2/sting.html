<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Fraunces"; src: url("/official/fraunces-var.woff2") format("woff2"); font-weight: 100 900; }
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// The official logo as a video intro (3 s) and ending (3.5 s): the animated "Whoever's up" logo on the night-blue ground.
const W = 1080, H = 1920, g = document.getElementById("c").getContext("2d"), GOLD = "#ffd27a";
const LEN = { intro: 3.0, outro: 3.5 };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (k) => (k = clamp(k), k * k * (3 - 2 * k));
const back = (k) => { k = clamp(k); const s = 1.7; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const STARS = (() => { let s = 31; const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); const o = []; for (let i = 0; i < 70; i++) o.push([r() * W, r() * H, r() < 0.2 ? 3 : 2, r() * 6.28]); return o; })();
const imgs = {}; const load = (src) => imgs[src] || (imgs[src] = new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }));
const pad = (n) => String(n).padStart(4, "0");
function words(parts, y, font, alpha, scale = 1) {
  if (alpha <= 0) return;
  g.save(); g.font = font; g.textBaseline = "alphabetic"; const w = parts.reduce((s, [t]) => s + g.measureText(t).width, 0);
  g.translate(W / 2, y - 30); g.scale(scale, scale); g.translate(-W / 2, -(y - 30)); g.globalAlpha = alpha;
  let x = W / 2 - w / 2; g.shadowColor = "rgba(0,0,0,0.35)"; g.shadowBlur = 24;
  for (const [t, c] of parts) { g.fillStyle = c; g.fillText(t, x, y); x += g.measureText(t).width; }
  g.restore();
}
async function frame(t, mode) {
  const L = LEN[mode];
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#0b1a3a"); gr.addColorStop(1, "#1b3263"); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (const [x, y, s, ph] of STARS) { g.fillStyle = `rgba(255,248,225,${0.5 + 0.45 * Math.sin(t * 2.3 + ph)})`; g.fillRect(Math.round(x / 4) * 4, Math.round(y / 4) * 4, s * 4, s * 4); }
  const startFrame = mode === "intro" ? 40 : 52; // the five (2026-11-11): intro opens on Dawn rising into Ray; the ending on Ray
  const logo = await load(`/official2/frames/${pad(clamp(Math.floor(startFrame + t * 30), 1, 300))}.png`);
  const r = clamp(back((t - 0.05) / 0.5), 0, 1.2);
  const out = mode === "intro" ? ease((t - (L - 0.35)) / 0.35) : 0;
  const S = (mode === "intro" ? 620 : 680) * r * (1 + 0.15 * out), cy = mode === "intro" ? 860 : 790;
  if (S > 2) { g.save(); g.globalAlpha = 1 - out; g.translate(W / 2, cy); g.shadowColor = "rgba(0,0,0,0.45)"; g.shadowBlur = 60; g.shadowOffsetY = 20; g.beginPath(); g.roundRect(-S / 2, -S / 2, S, S, S * 0.2237); g.fillStyle = "#0b1a3a"; g.fill(); g.shadowColor = "transparent"; g.clip(); g.drawImage(logo, -S / 2, -S / 2, S, S); g.restore(); }
  if (mode === "intro") {
    words([["LifeFlow", "#ffffff"]], 1330, "500 112px Fraunces", clamp((t - 0.55) / 0.3) * (1 - out), back((t - 0.55) / 0.4));
  } else {
    words([["Let's clear your ", "#ffffff"], ["sky.", GOLD]], 1330, "600 104px Fraunces", clamp((t - 0.6) / 0.2), back((t - 0.6) / 0.38));
    words([["LifeFlow", "rgba(255,255,255,0.85)"]], 1450, "500 60px Fraunces", clamp((t - 1.1) / 0.3));
    const fo = ease((t - (L - 0.35)) / 0.35); if (fo > 0) { g.fillStyle = `rgba(0,0,0,${fo})`; g.fillRect(0, 0, W, H); }
  }
  if (mode === "intro" && out > 0) { g.fillStyle = `rgba(0,0,0,${out})`; g.fillRect(0, 0, W, H); }
}
window.seek = (t, mode) => frame(t, mode);
window.LEN = LEN;
window.ready = Promise.all([document.fonts.load("600 80px Fraunces"), document.fonts.load("500 40px Fraunces")]).then(() => true);
</script></body></html>
