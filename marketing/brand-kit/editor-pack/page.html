<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: "Fraunces"; src: url("fraunces-var.woff2") format("woff2"); font-weight: 100 900; }
html,body{margin:0;background:transparent} canvas{display:block}
</style></head><body><canvas id="c"></canvas>
<script src="lf2.js"></script><script src="cloud.js"></script>
<script>
const LF = window.LF, cv = document.getElementById("c"), g = cv.getContext("2d");
const sprite = document.createElement("canvas");
window.skyling = (key, night, float) => {  // the app's own sprite, 20 screen pixels per pixel, transparent
  const info = LF.COMPANIONS.find((c) => c.key === key);
  LF.drawCompanion(sprite, info, "idle", 0, night, false, !!float, !!float);
  cv.width = cv.height = 24 * 20; g.clearRect(0, 0, cv.width, cv.height); g.imageSmoothingEnabled = false; g.drawImage(sprite, 0, 0, 480, 480);
  return info.name;
};
window.cloud = (i, night, cw, ch, S) => new Promise((res) => {  // the idea cloud (cloud-tile.ts), nine-slice, crisp
  const st = window.LFC.cloudStyle(i), [T, R, B, L] = st["--cloud-slice"].split(" ").map(Number), im = new Image();
  im.onload = () => {
    const t = document.createElement("canvas"); t.width = 48; t.height = 21; t.getContext("2d").drawImage(im, 0, 0);
    const sx = [0, L, 48 - R, 48], sy = [0, T, 21 - B, 21], dx = [0, L * S, L * S + cw, L * S + cw + R * S], dy = [0, T * S, T * S + ch, T * S + ch + B * S];
    cv.width = dx[3]; cv.height = dy[3]; g.clearRect(0, 0, cv.width, cv.height); g.imageSmoothingEnabled = false;
    for (let r = 0; r < 3; r++) for (let q = 0; q < 3; q++) g.drawImage(t, sx[q], sy[r], sx[q + 1] - sx[q], sy[r + 1] - sy[r], dx[q], dy[r], dx[q + 1] - dx[q], dy[r + 1] - dy[r]);
    res([dx[1], dy[1], cw, ch]);
  };
  im.src = (night ? st["--cloud-night"] : st["--cloud-day"]).slice(5, -2);
});
window.caption = (bg) => new Promise((res) => {  // the reels' caption style over a real app screen
  const im = new Image(); im.onload = () => {
    cv.width = 1080; cv.height = 1920; g.drawImage(im, 0, 0, 1080, 1920);
    const lines = ["Your day,", "drawn as the sky."], size = 66, lh = size * 1.12, y = 1150;
    g.font = `600 ${size}px Fraunces`; const w = Math.max(...lines.map((l) => g.measureText(l).width)) + 90, h = lh * lines.length + 60;
    g.save(); g.translate(540, y); g.shadowColor = "rgba(0,0,0,0.35)"; g.shadowBlur = 40; g.fillStyle = "rgba(11,26,58,0.94)"; g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 44); g.fill(); g.shadowColor = "transparent";
    g.textBaseline = "middle"; lines.forEach((l, i) => { const parts = l.split(/(sky)/); let x = -g.measureText(l).width / 2; const yy = -h / 2 + 30 + lh * (i + 0.5);
      for (const p of parts) { g.fillStyle = p === "sky" ? "#FFD27A" : "#ffffff"; g.fillText(p, x, yy); x += g.measureText(p).width; } });
    g.restore(); res(true); };
  im.src = bg;
});
window.ready = document.fonts.load("600 66px Fraunces");
</script></body></html>
