<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Fraunces"; src: url("/official/fraunces-var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist"; src: url("/official/geist-latin.woff2") format("woff2"); font-weight: 100 900; }
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="/official/lf2.js"></script>
<script>
// "Let the sky choose": the new "Changes with the sky" skyling, filmed in the real app (local build of main, sample week),
// with the sky in the app's own colours (lib/sky.ts) and the skylings drawn by the app's code. Wording: WORDS.md.
const LF = window.LF;
const W = 1080, H = 1920, cv = document.getElementById("c"), g = cv.getContext("2d");
const RISE = 400, SET = 1010; // New York, Nov 9: sunrise about 6:40 AM, sunset about 4:50 PM (as the app says)
const T = { set: 2.0, day: 4.8, step: 1.5, end: 13.8, fin: 17.6 };
const MOMENTS = [["dawn", "Dawn", "6:20 AM", 380], ["ray", "Ray", "8:00 AM", 480], ["noon", "Noon", "12:30 PM", 750], ["goldie", "Goldie", "4:00 PM", 960], ["dusk", "Dusk", "5:10 PM", 1030], ["star", "Star", "11:00 PM", 1380]];
const GOLD = "#ffd27a";
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (k) => (k = clamp(k), k * k * (3 - 2 * k));
const back = (k) => { k = clamp(k); const s = 1.7; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const rgb = (c, a = 1) => `rgba(${c.map(Math.round).join(",")},${a})`;
const imgs = {};
const load = (src) => imgs[src] || (imgs[src] = new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(src)); i.src = src; }));
const pad = (n) => String(n).padStart(4, "0");

// ---------- the sky behind everything ----------
const STARS = (() => { let s = 11; const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); const o = []; for (let i = 0; i < 70; i++) o.push([r() * W, r() * H * 0.95, r() < 0.2 ? 3 : 2, r() * 6.28]); return o; })();
function sky(m, t) {
  const [top, mid, low] = LF.skyAt(m, RISE, SET), dark = LF.darkness(m, RISE, SET);
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, rgb(top)); gr.addColorStop(0.62, rgb(mid)); gr.addColorStop(1, rgb(low));
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  if (dark > 0.2) for (const [x, y, s, ph] of STARS) { g.fillStyle = `rgba(255,248,225,${((dark - 0.2) / 0.8) * (0.55 + 0.45 * Math.sin(t * 2.3 + ph))})`; g.fillRect(Math.round(x / 4) * 4, Math.round(y / 4) * 4, s * 4, s * 4); }
}
function minuteAt(t) {
  if (t < T.day - 0.35) return 480;
  const keys = [[T.day - 0.35, 480]];
  MOMENTS.forEach(([, , , m], i) => { const s = T.day + i * T.step; keys.push([s + 0.12, m]); keys.push([s + T.step - 0.35, m + 12]); });
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const [a, ma] = keys[i - 1], [b, mb] = keys[i]; return ma + (mb - ma) * ease((t - a) / (b - a)); }
  return 1392;
}

// ---------- words ----------
function words(parts, y, size, alpha = 1, scale = 1, font = "600 {s}px Fraunces") {
  if (alpha <= 0) return;
  g.save(); g.font = font.replace("{s}", size); g.textBaseline = "alphabetic";
  const w = parts.reduce((s, [t]) => s + g.measureText(t).width, 0);
  g.translate(W / 2, y - size * 0.35); g.scale(scale, scale); g.translate(-W / 2, -(y - size * 0.35));
  let x = W / 2 - w / 2; g.globalAlpha = alpha; g.shadowColor = "rgba(10,20,40,0.35)"; g.shadowBlur = 24;
  for (const [t, col] of parts) { g.fillStyle = col; g.fillText(t, x, y); x += g.measureText(t).width; }
  g.restore();
}
const popIn = (t, a, d = 0.38) => (t < a ? 0 : back((t - a) / d));
function pill(text, y, alpha, scale) {
  if (alpha <= 0) return;
  g.save(); g.font = "600 40px Geist"; const w = g.measureText(text).width + 64, h = 74;
  g.translate(W / 2, y); g.scale(scale, scale); g.globalAlpha = alpha;
  g.shadowColor = "rgba(10,20,40,0.25)"; g.shadowBlur = 20; g.fillStyle = "rgba(255,255,255,0.94)";
  g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, h / 2); g.fill(); g.shadowBlur = 0;
  g.fillStyle = "#1d1a16"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, 0, 2); g.restore();
}
function card(im, x, y, w, alpha = 1, dy = 0, sc = 1) {
  if (alpha <= 0 || !im) return;
  const h = (w * im.height) / im.width;
  g.save(); g.globalAlpha = alpha; g.translate(x + w / 2, y + h / 2 + dy); g.scale(sc, sc); g.translate(-(x + w / 2), -(y + h / 2));
  g.shadowColor = "rgba(10,20,40,0.35)"; g.shadowBlur = 50; g.shadowOffsetY = 18;
  g.beginPath(); g.roundRect(x, y, w, h, 52); g.fillStyle = "#fff"; g.fill(); g.shadowColor = "transparent";
  g.clip(); g.drawImage(im, x, y, w, h); g.restore();
}
// ---------- the skylings, drawn by the app's own code ----------
const sprite = document.createElement("canvas");
function skyling(key, x, yFeet, scale, pose, frame, night) {
  const info = LF.COMPANIONS.find((c) => c.key === key);
  LF.drawCompanion(sprite, info, pose, frame, night, false);
  const s = 24 * scale; g.save(); g.imageSmoothingEnabled = false; g.drawImage(sprite, Math.round(x - s / 2), Math.round(yFeet - s), s, s); g.restore();
}

async function frame(t) {
  // background sky
  sky(minuteAt(t), t);

  // 1. hook: "Can't pick just one skyling?" and the six hop in a row
  if (t < T.set + 0.3) {
    const a = 1 - ease((t - (T.set - 0.25)) / 0.3);
    words([["Can't pick", "#ffffff"]], 660, 140, a * clamp((t - 0.12) / 0.2), popIn(t, 0.12));
    words([["just one ", "#ffffff"], ["skyling?", GOLD]], 830, 118, a * clamp((t - 0.42) / 0.2), popIn(t, 0.42));
    MOMENTS.forEach(([key], i) => {
      const at = 0.75 + i * 0.12, k = clamp((t - at) / 0.42);
      if (t < at) return;
      const hop = Math.sin(Math.PI * k) * 90, x = 140 + i * 160;
      g.save(); g.globalAlpha = a * clamp((t - at) / 0.12); skyling(key, x, 1330 - hop, 9, k < 1 ? "celebrate" : "idle", Math.floor((t - at) * 7), false); g.restore();
    });
  }

  // 2. Settings: tap "Changes with the sky"
  if (t > T.set - 0.3 && t < T.day + 0.2) {
    const f = clamp(Math.floor((t - T.set) * 30) + 1, 1, 84);
    const im = await load(`/skyreel/settings/${pad(f)}.jpg`);
    const enter = ease((t - (T.set - 0.25)) / 0.35), leave = ease((t - (T.day - 0.25)) / 0.3);
    card(im, 40, 450, 1000, enter * (1 - leave), (1 - enter) * 90 - leave * 80);
    const swap = ease((t - 3.15) / 0.25);
    words([["Now you don't have to.", "#ffffff"]], 345, 82, enter * (1 - leave) * (1 - swap), popIn(t, T.set - 0.05));
    words([["Let the ", "#ffffff"], ["sky", GOLD], [" choose.", "#ffffff"]], 345, 96, (1 - leave) * swap, popIn(t, 3.15));
    // the tap
    const u = t - 2.8;
    if (u > 0 && u < 0.5) { g.save(); g.globalAlpha = (1 - u / 0.5) * 0.9; g.strokeStyle = "#fff"; g.lineWidth = 10; g.beginPath(); g.arc(540, 1445, 40 + u * 240, 0, 6.283); g.stroke(); g.restore(); }
  }

  // 3. the day: whoever's up, at six moments
  if (t > T.day - 0.3 && t < T.end + 0.3) {
    const hk = ease((t - (T.day - 0.1)) / 0.3) * (1 - ease((t - (T.end - 0.3)) / 0.3));
    words([["Whoever's up,", "#ffffff"]], 205, 96, hk, popIn(t, T.day - 0.1));
    words([["all day long.", "#ffffff"]], 312, 96, hk, popIn(t, T.day + 0.08));
    for (let i = 0; i < MOMENTS.length; i++) {
      const s = T.day + i * T.step, e = s + T.step;
      if (t < s - 0.3 || t > e + 0.05) continue;
      const [key, name, clock] = MOMENTS[i];
      const f = clamp(Math.floor((t - s + 0.3) * 30) + 1, 1, 54);
      const im = await load(`/skyreel/today_${key}/${pad(f)}.jpg`);
      const enter = ease((t - (s - 0.28)) / 0.3);
      const last = i === MOMENTS.length - 1;
      const leave = last ? ease((t - (T.end - 0.25)) / 0.3) : ease((t - (e - 0.25)) / 0.25);
      card(im, 40, 450, 1000, enter * (1 - leave), (1 - enter) * 120 - leave * 60, 0.96 + 0.04 * enter);
      pill(`${clock} · ${name}`, 392, enter * (1 - leave), popIn(t, s - 0.05, 0.32));
    }
  }

  // 4. the end: the official logo and "Let's clear your sky."
  if (t > T.end - 0.3) {
    const u = t - T.end, k = ease((u + 0.3) / 0.45);
    g.save(); g.globalAlpha = k; const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#0b1a3a"); gr.addColorStop(1, "#1b3263"); g.fillStyle = gr; g.fillRect(0, 0, W, H); g.restore();
    for (const [x, y, s, ph] of STARS) { g.fillStyle = `rgba(255,248,225,${k * (0.5 + 0.45 * Math.sin(t * 2.3 + ph))})`; g.fillRect(Math.round(x / 4) * 4, Math.round(y / 4) * 4, s * 4, s * 4); }
    const lf = clamp(Math.floor(60 + Math.max(0, u) * 30), 1, 360);
    const logo = await load(`/official/frames/${pad(lf)}.png`);
    const r = clamp(back((u - 0.05) / 0.5), 0, 1.2), S = 680 * r;
    if (S > 2) { g.save(); g.translate(W / 2, 790); g.shadowColor = "rgba(0,0,0,0.45)"; g.shadowBlur = 60; g.shadowOffsetY = 20; g.beginPath(); g.roundRect(-S / 2, -S / 2, S, S, S * 0.2237); g.fillStyle = "#0b1a3a"; g.fill(); g.shadowColor = "transparent"; g.clip(); g.drawImage(logo, -S / 2, -S / 2, S, S); g.restore(); }
    words([["Let's clear your ", "#ffffff"], ["sky.", GOLD]], 1330, 104, clamp((u - 0.7) / 0.2), popIn(t, T.end + 0.7));
    words([["LifeFlow", "rgba(255,255,255,0.85)"]], 1450, 60, clamp((u - 1.25) / 0.3), 1, "500 {s}px Fraunces");
    const fo = ease((t - (T.fin - 0.35)) / 0.35); if (fo > 0) { g.fillStyle = `rgba(0,0,0,${fo})`; g.fillRect(0, 0, W, H); }
  }
}
window.seek = (t) => frame(t);
window.T = T;
window.ready = Promise.all([document.fonts.load("600 80px Fraunces"), document.fonts.load("500 40px Fraunces"), document.fonts.load("600 40px Geist")]).then(() => true);
</script></body></html>
