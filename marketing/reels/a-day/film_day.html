<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Fraunces"; src: url("/official/fraunces-var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist"; src: url("/official/geist-latin.woff2") format("woff2"); font-weight: 100 900; }
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// "A day, at its real time" (rough cut): marked gaps for the owner's real shots, cut with the real app filmed at the same time of day.
// The edit lives in timeline.json (timeline.py); every picture is a real capture of the app.
const W = 1080, H = 1920, g = document.getElementById("c").getContext("2d"), GOLD = "#ffd27a", K = 2.5;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (k) => (k = clamp(k), k * k * (3 - 2 * k));
const back = (k) => { k = clamp(k); const s = 1.6; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const imgs = {}; const load = (src) => imgs[src] || (imgs[src] = new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(src)); i.src = src; }));
const pad = (n) => String(n).padStart(4, "0");
let TL = null; const LOGS = {};
function text(lines, y, size, { alpha = 1, scale = 1, box = false } = {}) {
  if (alpha <= 0) return;
  g.save(); g.font = `600 ${size}px Fraunces`;
  let sz = size; for (const l of lines) { const w = g.measureText(l).width; if (w > 940) sz = Math.min(sz, size * 940 / w); }
  g.font = `600 ${sz}px Fraunces`; const lh = sz * 1.12, h = lh * lines.length;
  g.translate(W / 2, y); g.scale(scale, scale); g.globalAlpha = alpha;
  if (box) { const bw = Math.max(...lines.map((l) => g.measureText(l).width)) + 90, bh = h + 60;
    g.shadowColor = "rgba(0,0,0,0.35)"; g.shadowBlur = 40; g.fillStyle = "rgba(11,26,58,0.94)"; g.beginPath(); g.roundRect(-bw / 2, -bh / 2, bw, bh, 44); g.fill(); g.shadowColor = "transparent"; }
  else { g.shadowColor = "rgba(0,0,0,0.45)"; g.shadowBlur = 26; }
  g.textBaseline = "middle";
  lines.forEach((l, i) => { const parts = l.split(/(sky|new)/); let x = -g.measureText(l).width / 2; const yy = -h / 2 + lh * (i + 0.5);
    for (const p of parts) { g.fillStyle = p === "sky" || (p === "new" && !box) ? GOLD : "#ffffff"; g.fillText(p, x, yy); x += g.measureText(p).width; } });
  g.restore();
}
function dim(alpha, holes) {
  if (alpha <= 0) return;
  g.save(); g.beginPath(); g.rect(0, 0, W, H);
  for (const h of holes) g.roundRect(h[0], h[1], h[2], h[3], h[4]);
  g.fillStyle = `rgba(6,12,28,${alpha})`; g.fill("evenodd"); g.restore();
}
function fingerAt(e) {
  if (!e || !e.finger) return; const [x, y] = [e.finger[0] * K, e.finger[1] * K], tap = /^tap/.test(e.tag) && !/-after$/.test(e.tag);
  g.save(); g.fillStyle = "rgba(255,255,255,0.45)"; g.strokeStyle = "#fff"; g.lineWidth = 7; g.shadowColor = "rgba(0,0,0,0.3)"; g.shadowBlur = 18;
  g.beginPath(); g.arc(x, y, tap ? 62 : 52, 0, 6.283); g.fill(); g.stroke(); g.restore();
}
function tapRing(u, x, y) { if (u < 0 || u > 0.6) return; g.save(); g.globalAlpha = 1 - u / 0.6; g.strokeStyle = "#fff"; g.lineWidth = 9; g.beginPath(); g.arc(x, y, 60 + u * 300, 0, 6.283); g.stroke(); g.restore(); }
const isTap = (e) => e && /^tap/.test(e.tag) && !/-after$/.test(e.tag) && e.finger;

function drawPh(s, u, alpha = 1) {
  g.save(); g.globalAlpha = alpha;
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#142451"); gr.addColorStop(1, "#0b1530"); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.setLineDash([26, 20]); g.lineWidth = 5; g.strokeStyle = "rgba(255,255,255,0.35)"; g.beginPath(); g.roundRect(70, 160, W - 140, H - 320, 56); g.stroke(); g.setLineDash([]);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "600 44px Geist"; g.fillStyle = GOLD; g.fillText("YOUR SHOT GOES HERE", W / 2, 330);
  const k = back((u - 0.05) / 0.45); g.save(); g.translate(W / 2, 820); g.scale(k, k); g.font = "600 210px Fraunces"; g.fillStyle = "#fff"; g.fillText(s.ph.time, 0, 0); g.restore();
  g.font = "500 54px Geist"; g.fillStyle = "rgba(255,255,255,0.92)"; g.fillText(s.ph.l1, W / 2, 1060); g.fillText(s.ph.l2, W / 2, 1140);
  g.font = "500 38px Geist"; g.fillStyle = "rgba(255,255,255,0.55)"; g.fillText("A real place, at this real time.", W / 2, 1600);
  g.restore();
}
async function drawSeg(s, t) {
  const u = t - s.start, i = clamp(Math.floor(u * 30), 0, s.frames.length - 1), f = s.frames[i], log = LOGS[s.src];
  if (s.ph) { drawPh(s, u); return { u, i, f, log: null }; }
  g.drawImage(await load(`${s.src}/${pad(f)}.jpg`), 0, 0, W, H);
  return { u, i, f, log };
}
async function frame(t) {
  if (!TL) { TL = await (await fetch("/whatsnew/timeline_day.json")).json(); for (const s of TL.segs) if (!s.end && !s.ph && !LOGS[s.src]) LOGS[s.src] = await (await fetch(`${s.src}/log.json`)).json().catch(() => null); }
  const k = TL.segs.findIndex((s, j) => t < s.start + s.dur || j === TL.segs.length - 1), s = TL.segs[k];
  const { u, i, f, log } = await drawSeg(s, t);
  // a soft cut from the segment before
  if (k > 0 && u < 0.25) { const p = TL.segs[k - 1]; if (p.ph) drawPh(p, p.dur, 1 - ease(u / 0.25)); else { g.save(); g.globalAlpha = 1 - ease(u / 0.25); g.drawImage(await load(`${p.src}/${pad(p.frames[p.frames.length - 1])}.jpg`), 0, 0, W, H); g.restore(); } }
  if (s.end) return;
  if (s.spot && log && log.anchors[s.spot.anchor]) { const [x, y, w, h] = log.anchors[s.spot.anchor], kk = ease((u - 0.15) / 0.3) * (1 - ease((u - (s.spot.until - 0.2)) / 0.2));
    dim(0.5 * kk, [[x * K - 22, y * K - 22, w * K + 44, h * K + 44, 56]]); }
  if (s.settings && log) { const [gx, gy, gw] = log.anchors.grid, [sx, sy, sw, sh] = log.anchors.sky, ti = s.frames.findIndex((ff) => log.frames[ff - 1] && log.frames[ff - 1].tag === "tap"), tt = ti / 30;
    if (u < tt) { const kk = ease((u - 0.3) / 0.35) * (1 - ease((u - (tt - 0.25)) / 0.25)); dim(0.55 * kk, [[gx * K - 12, gy * K - 12, gw * K + 24, log.anchors.grid[3] * K + 24, 50]]); }
    else { const kk = ease((u - tt) / 0.3); dim(0.5 * kk, [[sx * K - 12, sy * K - 12, sw * K + 24, sh * K + 24, 56]]); } }
  if (log) { fingerAt(log.frames[f - 1]);
    s.frames.forEach((ff, j) => { const e = log.frames[ff - 1]; if (isTap(e)) tapRing(u - j / 30, e.finger[0] * K, e.finger[1] * K); }); }
  if (s.hook) {
    text(["We rebuilt LifeFlow."], 270, 104, { alpha: clamp((u - 0.15) / 0.2) * (1 - ease((u - 1.95) / 0.25)), scale: back((u - 0.15) / 0.45) });
    text(["Here's what's new."], 400, 96, { alpha: clamp((u - 0.7) / 0.2) * (1 - ease((u - 1.95) / 0.25)), scale: back((u - 0.7) / 0.45) });
  }
  for (const [a, b, l1, l2, y] of s.caps) {
    if (u < a - 0.05 || u > b + 0.3) continue;
    text([l1, l2].filter(Boolean), y, 66, { alpha: Math.min(ease((u - a - 0.08) / 0.2), 1 - ease((u - b + 0.12) / 0.18)), scale: back((u - a - 0.08) / 0.38), box: true });
  }
}
window.seek = (t) => frame(t);
window.ready = Promise.all([document.fonts.load("600 80px Fraunces"), document.fonts.load("500 40px Geist"), fetch("/whatsnew/timeline_day.json").then((r) => r.json()).then((j) => (window.END = j.end))]).then(() => true);
</script></body></html>
