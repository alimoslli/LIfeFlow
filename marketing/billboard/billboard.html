<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Fraunces"; src: url("fraunces-var.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist"; src: url("geist-latin.woff2") format("woff2"); font-weight: 100 900; }
html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="2400" height="700"></canvas>
<script src="lf2.js"></script>
<script>
// A LifeFlow billboard (Ali, 2026-11-13): the sky of this moment, whoever's up peeking over the horizon, drawn by the app's own
// code (skyAt, darkness, skylingAt, drawCompanion), the brand's horizon line, and the words in highlight boxes.
const LF = window.LF, W = 2400, H = 700, cv = document.getElementById("c"), g = cv.getContext("2d");
const RISE = 395, SET = 1010, HY = 590, LINE_H = 30;
const rgb = (c, a = 1) => `rgba(${c.map(Math.round).join(",")},${a})`;
const rng = (s) => () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
const STARS = (() => { const r = rng(11), out = []; while (out.length < 70) { const x = r() * W, y = r() * HY * 0.92; out.push([x, y, r() < 0.25 ? 3 : 2, r() * 6.28]); } return out; })();
const icon = new Image(); icon.src = "icon.png";
const sprite = document.createElement("canvas");
const SOFT = (() => { const r = rng(23), out = []; while (out.length < 90) { const x = r() * W, y = r() * HY * 0.95; out.push([x, y, 1.2 + r() * r() * 4.2, r() * 6.28]); } return out; })();
function glowLine(y, color, glow) {
  g.save(); g.shadowColor = glow; g.shadowBlur = 28; g.strokeStyle = color; g.lineWidth = 5; g.lineCap = "round";
  g.beginPath(); g.moveTo(60, y); g.lineTo(W - 60, y); g.stroke(); g.shadowBlur = 60; g.globalAlpha = 0.6; g.stroke(); g.restore();
}
function gradText(text, x, y, size, c1, c2, font = "Fraunces", weight = 600, day = false) {
  g.font = `${weight} ${size}px ${font}`; const w = g.measureText(text).width;
  const gr = g.createLinearGradient(x, y - size, x + w, y); gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  g.save(); g.shadowColor = day ? "rgba(255,255,255,0.55)" : "rgba(5,12,35,0.55)"; g.shadowBlur = 24; g.shadowOffsetY = day ? 0 : 4; g.fillStyle = gr; g.fillText(text, x, y); g.restore();
  return w;
}
function draw(minute, { t = 0, up = 1 } = {}) {
  const [top, mid, low] = LF.skyAt(minute, RISE, SET), dark = LF.darkness(minute, RISE, SET);
  const m = ((minute % 1440) + 1440) % 1440, night = !(m >= RISE && m < SET);
  const key = LF.skylingAt(m, RISE, SET), info = LF.COMPANIONS.find((c) => c.key === key);
  const CX = 1430, lineY = HY;
  // the sky: one smooth gradient, a soft band of light along the horizon
  const sky = g.createLinearGradient(0, 0, 0, HY); sky.addColorStop(0, rgb(top)); sky.addColorStop(0.6, rgb(mid)); sky.addColorStop(1, rgb(low));
  g.fillStyle = sky; g.fillRect(0, 0, W, HY);
  const warm = [255, 210, 160], moonc = [150, 185, 240], gc = warm.map((v, i) => v + (moonc[i] - v) * dark);
  const band = g.createLinearGradient(0, HY - 220, 0, HY); band.addColorStop(0, rgb(gc, 0)); band.addColorStop(1, rgb(gc, 0.28 - 0.1 * dark));
  g.fillStyle = band; g.fillRect(0, HY - 220, W, 220);
  // round, glowing stars
  if (dark > 0.25) for (const [x, y, r, ph] of SOFT) {
    const a = (dark - 0.25) / 0.75 * (0.55 + 0.45 * Math.sin(t * 2.0 + ph));
    const sg = g.createRadialGradient(x, y, 0, x, y, r * 4); sg.addColorStop(0, `rgba(255,250,235,${a})`); sg.addColorStop(0.25, `rgba(255,245,220,${a * 0.6})`); sg.addColorStop(1, "rgba(255,245,220,0)");
    g.fillStyle = sg; g.beginPath(); g.arc(x, y, r * 4, 0, 6.283); g.fill();
  }
  // the skyling's own light behind it
  const halo = g.createRadialGradient(CX, HY - 230, 0, CX, HY - 230, 720);
  halo.addColorStop(0, rgb(gc, 0.55 - 0.15 * dark)); halo.addColorStop(0.35, rgb(gc, 0.22)); halo.addColorStop(1, rgb(gc, 0));
  g.fillStyle = halo; g.fillRect(0, 0, W, HY);
  // water: deep and glossy, with the skyling's light on it
  const water = g.createLinearGradient(0, HY, 0, H); water.addColorStop(0, "#1d3a72"); water.addColorStop(1, "#0a1836");
  g.fillStyle = water; g.fillRect(0, HY, W, H - HY);
  const floats = key === "moon" && night;
  LF.drawCompanion(sprite, info, "idle", 0, night, false, floats, floats);
  const FP = floats ? 26 : 34, sy = floats ? lineY - 40 - 21 * FP : lineY - 15 * FP + 6, rise = (1 - up) * (floats ? 22 * FP : 15 * FP);
  // reflection: soft, flipped, fading down into the water
  g.save(); g.beginPath(); g.rect(0, HY, W, H - HY); g.clip(); g.filter = "blur(7px)"; g.globalAlpha = 0.35 * up; g.imageSmoothingEnabled = false;
  g.translate(0, 2 * lineY); g.scale(1, -1); g.drawImage(sprite, Math.round(CX - 12 * FP), Math.round(sy + rise), 24 * FP, 24 * FP); g.restore();
  for (let i = 0; i < 7; i++) { const yy = HY + 18 + i * 14, w = 260 - i * 26; const lg = g.createRadialGradient(CX, yy, 0, CX, yy, w);
    lg.addColorStop(0, rgb(gc, 0.32 - i * 0.035)); lg.addColorStop(1, rgb(gc, 0)); g.save(); g.scale(1, 0.18); g.fillStyle = lg; g.beginPath(); g.arc(CX, yy / 0.18, w, 0, 6.283); g.fill(); g.restore(); }
  // the skyling (drawn by the app), with a soft bloom
  g.save(); g.beginPath(); g.rect(0, 0, W, lineY - 2); g.clip(); g.imageSmoothingEnabled = false;
  g.shadowColor = rgb(gc, 0.7); g.shadowBlur = 50;
  g.drawImage(sprite, Math.round(CX - 12 * FP), Math.round(sy + rise), 24 * FP, 24 * FP); g.restore();
  // the glowing glass horizon
  glowLine(lineY, "rgba(220,236,255,0.95)", "rgba(120,180,255,0.9)");
  // the words: smooth serif, the second half in warm gold
  const day = dark < 0.45; // by day the words turn deep navy and amber so they read on a bright sky
  gradText("Stop drowning in", 130, 225, 108, day ? "#142451" : "#FFFFFF", day ? "#1E3A70" : "#E8F0FF", "Fraunces", 700, day);
  gradText("deadlines, shifts", 130, 345, 108, day ? "#B4521A" : "#FFE6A8", day ? "#D9772B" : "#FFC266", "Fraunces", 700, day);
  gradText("and bills.", 130, 465, 108, day ? "#B4521A" : "#FFE6A8", day ? "#D9772B" : "#FFC266", "Fraunces", 700, day);
  // the brand on frosted glass
  const bx = 1860, by = 175, bw = 450, bh = 290;
  g.save(); g.fillStyle = dark < 0.45 ? "rgba(20,36,81,0.62)" : "rgba(255,255,255,0.12)"; g.strokeStyle = "rgba(255,255,255,0.28)"; g.lineWidth = 2;
  g.shadowColor = "rgba(5,12,35,0.35)"; g.shadowBlur = 40; g.beginPath(); g.roundRect(bx, by, bw, bh, 48); g.fill(); g.shadowBlur = 0; g.stroke(); g.restore();
  g.save(); g.beginPath(); g.roundRect(bx + 42, by + 48, 112, 112, 26); g.clip(); g.drawImage(icon, bx + 42, by + 48, 112, 112); g.restore();
  g.font = "600 82px Fraunces"; g.fillStyle = "#F7F9FF"; g.fillText("LifeFlow", bx + 176, by + 132);
  g.font = "500 40px Geist"; g.fillStyle = "rgba(240,245,255,0.92)"; g.fillText("Let’s clear your sky.", bx + 46, by + 238);
  return key;
}
// the digital version: the sky flows through the day and whoever's up pops over the horizon (the logo's timing)
const CAST = [["dawn", 380], ["ray", 560], ["goldie", 960], ["star", 1120], ["moon", 1380]], SEG = 2;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (k) => (k = clamp(k), k * k * (3 - 2 * k));
const smoother = (k) => (k = clamp(k), k * k * k * (k * (k * 6 - 15) + 10));
const back = (k) => { k = clamp(k); const s = 1.9; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
function minuteAt(t) {
  const A = 0.3, B = 1.5, keys = [[0, CAST[0][1] - 20]];
  CAST.forEach(([, m], i) => { keys.push([i * SEG + A, m]); keys.push([i * SEG + B, m + 8]); });
  keys.push([99, CAST[CAST.length - 1][1] + 20]);
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const [t0, m0] = keys[i - 1], [t1, m1] = keys[i]; return m0 + (m1 - m0) * smoother((t - t0) / (t1 - t0)); }
  return CAST[CAST.length - 1][1];
}
window.drawT = (t) => {
  const i = Math.min(CAST.length - 1, Math.floor(t / SEG)), u = t - i * SEG, last = i === CAST.length - 1;
  const up = u < 0.55 ? back(u / 0.55) : (!last && u > 1.6) ? 1 - ease((u - 1.6) / 0.38) : 1;
  return draw(Math.max(minuteAt(t), CAST[i][1] - 40), { t, up: Math.max(0, up) });
};
window.draw = draw;
window.ready = Promise.all([document.fonts.load("500 40px Geist"), document.fonts.load("600 84px Fraunces"), new Promise((r) => (icon.complete ? r() : (icon.onload = r)))]);
</script></body></html>
